name: Traduction en direct (branche) — build iOS
run-name: Traduction en direct — build #${{ github.run_number }}

# Compile la branche de la traduction en direct (Google ML Kit + WhisperKit + llama.cpp)
# et produit une IPA de test. Ne publie aucune release.
on:
  workflow_dispatch:
  push:
    branches: [feature/traduction-temps-reel]
    paths:
      - 'SarahIA/**'
      - '.github/workflows/ios-translation-branch.yml'

concurrency:
  group: sarahia-translation-branch
  cancel-in-progress: true

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Restore website voice bridge before compiling
        run: |
          set -euo pipefail
          python3 .github/scripts/restore_website_voice_bridge.py
          grep -q 'public func speakWebsiteGuide(' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'public func speakSequence(' SarahIA/SarahIA/Services/MultiAgentVoiceManager.swift

      - name: Verify translation stack (no call code, no paid service)
        run: |
          set -euo pipefail
          grep -q 'import WhisperKit' SarahIA/SarahIA/Services/WhisperService.swift
          grep -q 'MLKitTranslate' SarahIA/SarahIA/Services/TranslationEngine.swift
          grep -q 'public struct LiveTranslationView' SarahIA/SarahIA/Views/LiveTranslationView.swift
          if grep -rq 'WebRTCVoiceCallManager\|VoiceCallContactManager' SarahIA/SarahIA; then
            echo 'Code d appel encore present'; exit 1
          fi
          if grep -rqi 'deepl\.com\|mymemory' SarahIA/SarahIA; then
            echo 'Service payant encore present'; exit 1
          fi
          echo 'Translation stack verified'

      - name: Build llama.cpp v0.4.1 XCFramework
        run: |
          set -euo pipefail
          LLAMA_ROOT="$RUNNER_TEMP/llama.cpp"
          rm -rf "$LLAMA_ROOT"
          git clone --depth 1 --branch v0.4.1 https://github.com/ggml-org/llama.cpp.git "$LLAMA_ROOT"
          cd "$LLAMA_ROOT"
          ./build-xcframework.sh ios-device
          test -d build-apple/llama.xcframework

      - name: Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods dependencies (Google ML Kit)
        working-directory: SarahIA
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi
          pod --version
          pod install --repo-update
          test -d Pods/MLKitTranslate

      - name: Configure build number
        run: |
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace MinimumOSVersion -string "16.2" {} \; 2>/dev/null || true
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace CFBundleVersion -string "${{ github.run_number }}" {} \; 2>/dev/null || true

      - name: Build device app
        working-directory: SarahIA
        run: |
          set -euo pipefail
          LLAMA_FRAMEWORK=$(find "$RUNNER_TEMP/llama.cpp/build-apple/llama.xcframework" -path '*/ios-arm64/llama.framework' -type d -print -quit)
          test -n "$LLAMA_FRAMEWORK"
          LLAMA_FRAMEWORK_DIR=$(dirname "$LLAMA_FRAMEWORK")

          set -o pipefail
          xcodebuild \
            -workspace SarahIA.xcworkspace \
            -scheme SarahIA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            IPHONEOS_DEPLOYMENT_TARGET=16.2 \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            CLANG_ENABLE_MODULES=YES \
            FRAMEWORK_SEARCH_PATHS="\$(inherited) $LLAMA_FRAMEWORK_DIR" \
            OTHER_LDFLAGS='$(inherited) -framework llama -framework Accelerate -framework Metal -framework MetalKit -framework CoreML' \
            LD_RUNPATH_SEARCH_PATHS='$(inherited) @executable_path/Frameworks' \
            build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Summarize compiler errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          touch xcodebuild.log
          grep -E 'error:|fatal error|warning: .*(WhisperKit|MLKit)' xcodebuild.log | sort -u | head -200 > build-errors.txt
          tail -300 xcodebuild.log > build-tail.txt
          # Annotations lisibles via l'API (10 premières erreurs)
          grep -E '^/.*:[0-9]+:[0-9]+: error:' build-errors.txt | head -10 | while IFS= read -r line; do
            file=$(echo "$line" | cut -d: -f1); ln=$(echo "$line" | cut -d: -f2); msg=$(echo "$line" | cut -d: -f5-)
            echo "::error file=${file##*/},line=$ln::${msg}"
          done
          # Copie complète poussée sur une branche dédiée (journaux GitHub inaccessibles depuis certains environnements)
          mkdir -p /tmp/cilogs && cp build-errors.txt build-tail.txt /tmp/cilogs/
          cd /tmp/cilogs
          git init -q -b ci-logs-traduction
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Run ${{ github.run_id }} — commit ${{ github.sha }}" > RUN.txt
          git add -A && git commit -q -m "Erreurs du build ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-logs-traduction
          cat build-errors.txt | head -60

      - name: Download bundled AI models (Whisper base + Qwen3 1.7B)
        run: |
          set -euo pipefail
          MODELS="$RUNNER_TEMP/BundledModels"
          rm -rf "$MODELS" && mkdir -p "$MODELS/WhisperKitModels" "$MODELS/QwenModels" "$MODELS/Licenses"
          python3 -m venv "$RUNNER_TEMP/hfenv"
          "$RUNNER_TEMP/hfenv/bin/pip" install -q huggingface_hub
          "$RUNNER_TEMP/hfenv/bin/python" - <<'PY'
          from huggingface_hub import snapshot_download, hf_hub_download
          import shutil, os
          root = os.environ["RUNNER_TEMP"] + "/BundledModels"
          # Reconnaissance vocale : WhisperKit (Core ML) multilingue, licence MIT
          snapshot_download("argmaxinc/whisperkit-coreml", allow_patterns=["openai_whisper-base/*"],
                            local_dir=root + "/WhisperKitModels")
          for name in ["tokenizer.json", "tokenizer_config.json"]:
              path = hf_hub_download("openai/whisper-base", name)
              shutil.copy(path, root + "/WhisperKitModels/openai_whisper-base/" + name)
          # Cerveau de Sarah : Qwen3 1.7B Q4_K_M, licence Apache-2.0
          path = hf_hub_download("unsloth/Qwen3-1.7B-GGUF", "Qwen3-1.7B-Q4_K_M.gguf")
          shutil.copy(path, root + "/QwenModels/Qwen3-1.7B-Q4_K_M.gguf")
          lic = hf_hub_download("Qwen/Qwen3-1.7B-GGUF", "LICENSE")
          shutil.copy(lic, root + "/Licenses/Qwen3-Apache-2.0.txt")
          PY
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/openai/whisper/main/LICENSE' -o "$MODELS/Licenses/OpenAI-Whisper-MIT.txt"
          curl -L --fail --retry 3 'https://raw.githubusercontent.com/argmaxinc/WhisperKit/main/LICENSE' -o "$MODELS/Licenses/WhisperKit-MIT.txt"
          cp "$RUNNER_TEMP/llama.cpp/LICENSE" "$MODELS/Licenses/llama.cpp-MIT.txt"
          rm -rf "$MODELS/WhisperKitModels/.cache"
          test -d "$MODELS/WhisperKitModels/openai_whisper-base/TextDecoder.mlmodelc"
          test -s "$MODELS/WhisperKitModels/openai_whisper-base/tokenizer.json"
          test -s "$MODELS/QwenModels/Qwen3-1.7B-Q4_K_M.gguf"
          du -sh "$MODELS"/*

      - name: Package IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name 'SarahIA.app' -type d | head -n 1)
          test -n "$APP_PATH"

          LLAMA_FRAMEWORK=$(find "$RUNNER_TEMP/llama.cpp/build-apple/llama.xcframework" -path '*/ios-arm64/llama.framework' -type d -print -quit)
          if file "$LLAMA_FRAMEWORK/llama" | grep -q 'dynamically linked shared library'; then
            mkdir -p "$APP_PATH/Frameworks"
            cp -R "$LLAMA_FRAMEWORK" "$APP_PATH/Frameworks/"
          fi

          # Modèles d'IA intégrés : Sarah parle et comprend dès l'installation, sans téléchargement
          cp -R "$RUNNER_TEMP/BundledModels/WhisperKitModels" "$APP_PATH/"
          cp -R "$RUNNER_TEMP/BundledModels/QwenModels" "$APP_PATH/"
          mkdir -p "$APP_PATH/Licenses" && cp "$RUNNER_TEMP/BundledModels/Licenses/"* "$APP_PATH/Licenses/"
          du -sh "$APP_PATH"

          rm -rf /tmp/Payload && mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/
          APP_TARGET_DIR="/tmp/Payload/$(basename "$APP_PATH")"
          if [ -d "$APP_TARGET_DIR/Frameworks" ]; then
            find "$APP_TARGET_DIR/Frameworks" -type d -name '*.framework' -print0 | while IFS= read -r -d '' F; do codesign -f -s - "$F"; done
          fi
          codesign -f -s - "$APP_TARGET_DIR"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd /tmp && zip -ryq "$GITHUB_WORKSPACE/dist/SarahIA-traduction.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/dist/SarahIA-traduction.ipa"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-traduction-build-log
          path: |
            xcodebuild.log
            build-errors.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish test IPA (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sarah-ia-traduction-test
          target_commitish: ${{ github.sha }}
          name: 'Sarah IA — version complète (test)'
          body: 'IPA complète de la branche feature/traduction-temps-reel (build #${{ github.run_number }}, commit ${{ github.sha }}). Modèles intégrés : Whisper base (voix, hors ligne) + Qwen3 1.7B (cerveau, hors ligne). Traduction hébreu ⇄ français Google ML Kit (packs téléchargés au premier lancement). IPA non signée.'
          files: dist/SarahIA-traduction.ipa
          overwrite_files: true
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
