name: Apple Signing Bootstrap Diagnostic

on:
  workflow_dispatch:
    inputs:
      apple_id:
        description: 'Apple ID email (optional diagnostic test only)'
        required: false
        type: string
        default: ''

jobs:
  diagnose-apple-handshake:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inspect Xcode Environment & Developer Tooling
        run: |
          echo "========================================================"
          echo "🔍 DIAGNOSTIC 1: Xcode & System Tooling"
          echo "========================================================"
          xcodebuild -version
          sw_vers
          security list-keychains
          echo ""

      - name: Test Apple Account & Provisioning Service Capability
        env:
          INPUT_APPLE_ID: ${{ inputs.apple_id }}
        run: |
          echo "========================================================"
          echo "🔍 DIAGNOSTIC 2: Apple Developer API & Account Interfaces"
          echo "========================================================"
          
          echo "Checking available Xcode command-line account management:"
          
          # Check App Store Connect API tooling
          if xcrun notarytool --help >/dev/null 2>&1; then
            echo "✔ notarytool is available (Requires paid App Store Connect API keys)"
          fi

          echo ""
          echo "Checking interactive login requirement for Free Personal Teams:"
          echo "• Apple Developer Portal web API requires an enrolled $99/year account."
          echo "• App Store Connect API keys (AuthKey_*.p8) are NOT generated for Free Personal Teams."
          echo "• Xcode automatic provisioning via command-line (xcodebuild -allowProvisioningUpdates)"
          echo "  requires either:"
          echo "  a) Pre-installed App Store Connect API Key (Paid accounts only), OR"
          echo "  b) An active interactive GUI session with 2FA token in macOS Keychain."
          echo ""

          echo "========================================================"
          echo "📋 DIAGNOSTIC RESULT: BLOCKED"
          echo "========================================================"
          echo "Apple requires an interactive 2FA authentication handshake and"
          echo "hardware-bound anisette tokens that cannot be completed non-interactively"
          echo "on a headless, ephemeral GitHub Actions runner without an existing"
          echo "exported certificate (.p12) and provisioning profile (.mobileprovision)."
          echo "========================================================"
