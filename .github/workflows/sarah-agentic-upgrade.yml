name: Sarah agentic coding upgrade

on:
  push:
    branches:
      - sarah-agentic-code-2026-09-24
    paths:
      - .github/workflows/sarah-agentic-upgrade.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v4
        with:
          ref: sarah-agentic-code-2026-09-24
          fetch-depth: 0

      - name: Apply Sarah upgrade
        run: python3 .github/scripts/apply_sarah_agentic_upgrade.py

      - name: Validate patch
        run: |
          git diff --check
          git status --short

      - name: Commit patched application
        run: |
          git config user.name "Sarah Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Sarah agentic coding pipeline and purge 3D remnants"
          git push origin HEAD:sarah-agentic-code-2026-09-24

  build:
    needs: patch
    runs-on: xcode-27
    steps:
      - name: Checkout patched branch
        uses: actions/checkout@v4
        with:
          ref: sarah-agentic-code-2026-09-24
          fetch-depth: 0

      - name: Compile SarahIA without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project SarahIA/SarahIA.xcodeproj \
            -scheme SarahIA \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/sarah-build.log

  promote:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated branch
        uses: actions/checkout@v4
        with:
          ref: sarah-agentic-code-2026-09-24
          fetch-depth: 0

      - name: Fast-forward main
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          git push origin HEAD:main
