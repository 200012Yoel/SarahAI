name: iOS Simulator UI Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SarahIA/**'
      - '.maestro/**'
      - '.github/workflows/ios-simulator-ui-smoke.yml'
      - '.github/scripts/voice_media_runtime_refactor.py'
      - '.github/scripts/whisper_barge_in_runtime.py'
      - '.github/scripts/restore_website_voice_bridge.py'
      - '.github/scripts/production_quality_pass.py'

jobs:
  simulator-ui:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Apply same runtime migrations as release build
        run: |
          set -euo pipefail
          python3 .github/scripts/voice_media_runtime_refactor.py
          python3 .github/scripts/whisper_barge_in_runtime.py
          python3 .github/scripts/restore_website_voice_bridge.py
          python3 .github/scripts/production_quality_pass.py

      - name: Build Whisper XCFramework with simulator slice
        run: |
          set -euo pipefail
          WHISPER_ROOT="$RUNNER_TEMP/whisper.cpp"
          rm -rf "$WHISPER_ROOT"
          git clone --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp.git "$WHISPER_ROOT"
          cd "$WHISPER_ROOT"
          ./build-xcframework.sh
          SIM_FRAMEWORK=$(find build-apple/whisper.xcframework -path '*simulator*/whisper.framework' -type d -print -quit)
          test -n "$SIM_FRAMEWORK"
          echo "SIM_FRAMEWORK=$SIM_FRAMEWORK" >> "$GITHUB_ENV"
          echo "SIM_FRAMEWORK_DIR=$(dirname "$SIM_FRAMEWORK")" >> "$GITHUB_ENV"

      - name: Build SarahIA for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -project SarahIA/SarahIA.xcodeproj \
            -scheme SarahIA \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedDataSimulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            FRAMEWORK_SEARCH_PATHS="$SIM_FRAMEWORK_DIR" \
            OTHER_LDFLAGS='$(inherited) -framework whisper -framework Accelerate -framework Metal -framework CoreML' \
            build 2>&1 | tee "$GITHUB_WORKSPACE/simulator-build.log"
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedDataSimulator" -name 'SarahIA.app' -type d | head -n 1)
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Boot newest available iPhone Simulator
        run: |
          set -euo pipefail
          UDID=$(python3 - <<'PY'
          import json, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','--json']))
          candidates=[]
          for runtime, devices in data.get('devices', {}).items():
              for d in devices:
                  if d.get('isAvailable') and d.get('name','').startswith('iPhone'):
                      candidates.append((runtime, d['name'], d['udid']))
          if not candidates:
              raise SystemExit('No available iPhone Simulator')
          candidates.sort(reverse=True)
          print(candidates[0][2])
          PY
          )
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP_PATH"
          xcrun simctl launch "$UDID" com.sarahia.app

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Maestro CLI
        run: |
          set -euo pipefail
          curl -fsSL 'https://get.maestro.mobile.dev' | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Tap and verify SarahIA controls
        run: |
          set -euo pipefail
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro --version
          maestro test .maestro/ui-smoke.yaml

      - name: Capture final simulator screenshot
        if: always()
        run: |
          mkdir -p ui-smoke-artifacts
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl io "$SIM_UDID" screenshot ui-smoke-artifacts/final.png || true
          fi
          cp simulator-build.log ui-smoke-artifacts/ 2>/dev/null || true

      - name: Upload UI smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-simulator-ui-smoke
          path: ui-smoke-artifacts
          if-no-files-found: ignore
          retention-days: 7
