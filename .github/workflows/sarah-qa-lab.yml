name: Sarah IA - QA laboratoire video et traduction

on:
  workflow_dispatch:
  push:
    branches: [feature/neural-voices-whisper-only-20261011]
    paths:
      - 'SarahIA/**'
      - '.maestro/sarah-qa-e2e.yaml'
      - '.github/workflows/sarah-qa-lab.yml'

permissions:
  contents: read

concurrency:
  group: sarah-qa-lab
  cancel-in-progress: true

jobs:
  simulator-video:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare report directory
        run: mkdir -p qa-artifacts
      - name: Build actual native Whisper and Qwen simulator frameworks
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.4.1 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"
          (cd "$RUNNER_TEMP/llama.cpp" && ./build-xcframework.sh ios-sim)
          git clone --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp.git "$RUNNER_TEMP/whisper.cpp"
          (cd "$RUNNER_TEMP/whisper.cpp" && ./build-xcframework.sh)
          test -d "$RUNNER_TEMP/whisper.cpp/build-ios-sim/framework/whisper.framework"
          test -d "$RUNNER_TEMP/llama.cpp/build-ios-sim/framework/llama.framework"
      - name: Compile real app for iOS Simulator without replacing AI engines
        run: |
          set -euo pipefail
          WHISPER_DIR="$RUNNER_TEMP/whisper.cpp/build-ios-sim/framework"
          LLAMA_DIR="$RUNNER_TEMP/llama.cpp/build-ios-sim/framework"
          xcodebuild \
            -project SarahIA/SarahIA.xcodeproj \
            -scheme SarahIA -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$GITHUB_WORKSPACE/QA-DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            FRAMEWORK_SEARCH_PATHS="$WHISPER_DIR $LLAMA_DIR" \
            OTHER_LDFLAGS='$(inherited) -framework whisper -framework llama -framework Accelerate -framework Metal -framework MetalKit -framework CoreML' \
            build 2>&1 | tee qa-artifacts/simulator-build.log
          APP_PATH=$(find "$GITHUB_WORKSPACE/QA-DerivedData/Build/Products" -name 'SarahIA.app' -type d -print -quit)
          test -n "$APP_PATH"
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          mkdir -p "$APP_PATH/Frameworks"
          cp -R "$WHISPER_DIR/whisper.framework" "$APP_PATH/Frameworks/"
          cp -R "$LLAMA_DIR/llama.framework" "$APP_PATH/Frameworks/"
          codesign --force --sign - "$APP_PATH/Frameworks/whisper.framework"
          codesign --force --sign - "$APP_PATH/Frameworks/llama.framework"
          codesign --force --sign - "$APP_PATH"
      - name: Add genuine offline model files for the simulator
        run: |
          set -euo pipefail
          mkdir -p "$APP_PATH/WhisperModels" "$APP_PATH/TranslationModels" "$APP_PATH/NeuralVoices/Supertonic3"
          curl -fL --retry 3 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin' -o "$APP_PATH/WhisperModels/ggml-base.bin"
          curl -fL --retry 3 'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin' -o "$APP_PATH/WhisperModels/ggml-tiny.bin"
          curl -fL --retry 3 'https://huggingface.co/Qwen/Qwen3-0.6B-GGUF/resolve/main/Qwen3-0.6B-Q8_0.gguf' -o "$APP_PATH/TranslationModels/Qwen3-0.6B-Q8_0.gguf"
          test "$(stat -f%z "$APP_PATH/TranslationModels/Qwen3-0.6B-Q8_0.gguf")" -gt 500000000
          curl -fL --retry 3 'https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2' -o "$RUNNER_TEMP/supertonic.tar.bz2"
          echo "82fa96f91c4ef8abaae3a14a3f4153facf88bed821d1f7331cec2700f432c427  $RUNNER_TEMP/supertonic.tar.bz2" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/supertonic"
          tar -xjf "$RUNNER_TEMP/supertonic.tar.bz2" -C "$RUNNER_TEMP/supertonic"
          MODEL_ROOT=$(dirname "$(find "$RUNNER_TEMP/supertonic" -name 'voice.bin' -type f -print -quit)")
          for name in duration_predictor.int8.onnx text_encoder.int8.onnx vector_estimator.int8.onnx vocoder.int8.onnx tts.json unicode_indexer.bin voice.bin; do
            cp "$MODEL_ROOT/$name" "$APP_PATH/NeuralVoices/Supertonic3/"
          done
          codesign --force --sign - "$APP_PATH"
      - name: Boot simulator and install real application
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          def data(*args):
              return json.loads(subprocess.check_output(['xcrun','simctl','list',*args,'--json']))
          runtimes=[r for r in data('runtimes')['runtimes'] if 'iOS' in r['identifier'] and r.get('isAvailable',True)]
          if not runtimes: raise SystemExit('No iOS runtime')
          runtimes.sort(key=lambda r:tuple(int(n) for n in r['version'].split('.')),reverse=True)
          devices=[d for d in data('devicetypes')['devicetypes'] if d['name'].startswith('iPhone')]
          devices.sort(key=lambda d:(0 if '17' in d['name'] else 1,d['name']))
          udid=subprocess.check_output(['xcrun','simctl','create','Sarah QA',devices[0]['identifier'],runtimes[0]['identifier']],text=True).strip()
          subprocess.run(['xcrun','simctl','boot',udid],check=True)
          subprocess.run(['xcrun','simctl','bootstatus',udid,'-b'],check=True,timeout=240)
          subprocess.run(['xcrun','simctl','install',udid,os.environ['APP_PATH']],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('SIM_UDID='+udid+'\n')
          print('Simulator:',udid)
          PY
      - name: Install Java 17 for Maestro
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Capture genuine screen video and screenshots
        run: |
          set -euo pipefail
          xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 qa-artifacts/sarah-session.mp4 > qa-artifacts/video-recorder.log 2>&1 &
          RECORDER_PID=$!
          trap 'kill -INT "$RECORDER_PID" 2>/dev/null || true; wait "$RECORDER_PID" 2>/dev/null || true' EXIT
          xcrun simctl launch "$SIM_UDID" com.sarahia.app | tee qa-artifacts/launch.log
          sleep 5
          xcrun simctl io "$SIM_UDID" screenshot qa-artifacts/sarah-home.png
          curl -fsSL 'https://get.maestro.mobile.dev' | bash
          export PATH="$HOME/.maestro/bin:$PATH"
          maestro test .maestro/sarah-qa-e2e.yaml 2>&1 | tee qa-artifacts/maestro.log
          xcrun simctl io "$SIM_UDID" screenshot qa-artifacts/final.png
      - name: Collect process errors and video even after failures
        if: always()
        run: |
          if [ -n "${SIM_UDID:-}" ]; then
            xcrun simctl io "$SIM_UDID" screenshot qa-artifacts/last-state.png || true
            xcrun simctl spawn "$SIM_UDID" log show --last 5m --style compact --predicate 'process == "SarahIA"' > qa-artifacts/app-console.log 2>&1 || true
            xcrun simctl shutdown "$SIM_UDID" || true
            xcrun simctl delete "$SIM_UDID" || true
          fi
          printf '%s\n' 'Simulator is not physical iPhone microphone/Bluetooth validation.' > qa-artifacts/README-limitations.txt
      - name: Upload screenshots, session video, logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-QA-Screenshots-Videos
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14

  real-hebrew-audio:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Generate spoken Hebrew and run real local Whisper-Qwen processing
        run: bash .github/scripts/sarah_qa_real_hebrew_audio.sh
      - name: Upload voice WAV, actual transcripts, timings and model logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-QA-Real-Hebrew-Audio
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
