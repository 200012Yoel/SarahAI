                  SarahIA/SarahIA/Services/MultiAgentVoiceManager.swift \
                  SarahIA/SarahIA/ViewModels/ChatViewModel.swift \
                  SarahIA/SarahIA/Views/VoiceOrbModalView.swift
          git commit -m "Restore build 502 website menus and voice barge-in"
