name: Restore Website Builder and Voice Barge-In

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-builder-and-bargein.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore build 502 flow and voice interruption
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('SarahIA/SarahIA')

          # 1) Website builder: restore the validated build #502 flow, then add a new inspiration step.
          p = root / 'Views/ChatScreenView.swift'
          s = p.read_text()
          start = s.index('private struct WebsiteBuilderFlowView: View')
          end = s.index('/// Sélecteur UIKit minimal utilisé par le bouton appareil photo.', start)
          b = s[start:end]

          b = b.replace('@State private var visualStyle: String\n    @State private var accent: String',
                        '@State private var visualStyle: String\n    @State private var designMood: String\n    @State private var accent: String')

          b = re.sub(r'''    private let categories = \[.*?\n    \]\n\n    private let audiences = \[''', '''    private let categories = [
        WebsiteChoice(title: "E-commerce", icon: "bag.fill", detail: "Vendre des produits"),
        WebsiteChoice(title: "Voyage", icon: "airplane", detail: "Inspirer et réserver"),
        WebsiteChoice(title: "Restaurant", icon: "fork.knife", detail: "Menu et réservation"),
        WebsiteChoice(title: "Portfolio", icon: "person.crop.rectangle", detail: "Présenter son travail"),
        WebsiteChoice(title: "Entreprise", icon: "building.2.fill", detail: "Services et contact"),
        WebsiteChoice(title: "Événement", icon: "calendar", detail: "Informer et inscrire")
    ]

    private let audiences = [''', b, count=1, flags=re.S)

          style_start = b.index('    private let styleChoices = [')
          style_end = b.index('    private let accentOptions', style_start)
          new_styles = '''    private let moodChoices = [
        WebsiteChoice(title: "Minimaliste", icon: "rectangle.compress.vertical", detail: "Simple, calme et très lisible"),
        WebsiteChoice(title: "Élégant", icon: "sparkles", detail: "Raffiné, équilibré et premium"),
        WebsiteChoice(title: "Énergique", icon: "bolt.fill", detail: "Contrastes forts et rythme visuel"),
        WebsiteChoice(title: "Luxe", icon: "crown.fill", detail: "Sobre, éditorial et haut de gamme"),
        WebsiteChoice(title: "Naturel", icon: "leaf.fill", detail: "Doux, organique et chaleureux"),
        WebsiteChoice(title: "Tech", icon: "cpu", detail: "Précis, moderne et numérique")
    ]

    private let styleChoices = [
        WebsiteStyleChoice(title: "Apple Premium", icon: "apple.logo", detail: "Inspiré des pages produit Apple : grands espaces, verre discret et typographie monumentale"),
        WebsiteStyleChoice(title: "Google Color", icon: "circle.grid.2x2.fill", detail: "Inspiré de Material : blanc lumineux, cartes douces et palette multicolore"),
        WebsiteStyleChoice(title: "Tesla Minimal", icon: "bolt.car.fill", detail: "Minimalisme extrême, grands visuels, noir et blanc, appels à l’action nets"),
        WebsiteStyleChoice(title: "Microsoft Fluent", icon: "square.grid.2x2.fill", detail: "Surfaces Fluent, profondeur, transparence et détails bleus"),
        WebsiteStyleChoice(title: "Stripe Commerce", icon: "creditcard.fill", detail: "Dégradés premium, conversion, prix et hiérarchie orientée produit"),
        WebsiteStyleChoice(title: "Airbnb Travel", icon: "house.and.flag.fill", detail: "Chaleureux, photographique, arrondis généreux et navigation voyage"),
        WebsiteStyleChoice(title: "Shopify Store", icon: "bag.badge.plus", detail: "Boutique claire, fiches produit, panier et accents verts"),
        WebsiteStyleChoice(title: "Notion Editorial", icon: "doc.text.fill", detail: "Noir et blanc, éditorial, blocs sobres et typographie très lisible"),
        WebsiteStyleChoice(title: "Linear Tech", icon: "sparkle", detail: "Dark mode précis, halos subtils, violet froid et finition SaaS"),
        WebsiteStyleChoice(title: "Sarah Signature", icon: "wand.and.stars", detail: "Identité originale Sarah : verre sombre, cyan lumineux et détails futuristes")
    ]

'''
          b = b[:style_start] + new_styles + b[style_end:]

          old_init = '''        _visualStyle = State(initialValue: draft?.visualStyle ?? "")
        _accent = State(initialValue: draft?.accent ?? "Bleu")'''
          new_init = '''        let savedStyle = draft?.visualStyle ?? ""
        let savedParts = savedStyle.components(separatedBy: " · ")
        _designMood = State(initialValue: savedParts.count > 1 ? savedParts[0] : "")
        _visualStyle = State(initialValue: savedParts.count > 1 ? savedParts.dropFirst().joined(separator: " · ") : savedStyle)
        _accent = State(initialValue: draft?.accent ?? "Violet")'''
          b = b.replace(old_init, new_init)

          b = b.replace('Text(step == 3 ? "Derniers réglages" : "Construisons ton site")',
                        'Text(step == 4 ? "Derniers réglages" : "Construisons ton site")')

          b = re.sub(r'''    private var headerSubtitle: String \{.*?\n    \}\n\n    private var progress:''', '''    private var headerSubtitle: String {
        switch step {
        case 0:
            return "Choisis le type de site avec les mêmes cartes que la build 502."
        case 1:
            return "Donne le nom, l’objectif et le public du site."
        case 2:
            return "Choisis l’ambiance graphique du parcours original."
        case 3:
            return "Choisis ensuite une grande direction visuelle pour guider Raphaël."
        default:
            return "Sélectionne les sections à afficher avant la première maquette locale."
        }
    }

    private var progress:''', b, count=1, flags=re.S)

          b = b.replace('Text("Question \\(step + 1) sur 4")', 'Text("Question \\(step + 1) sur 5")')
          b = b.replace('Text("\\((step + 1) * 25) %")', 'Text("\\((step + 1) * 20) %")')
          b = b.replace('ProgressView(value: Double(step + 1), total: 4)', 'ProgressView(value: Double(step + 1), total: 5)')

          q_start = b.index('        case 2:', b.index('private var questionContent'))
          q_default = b.index('        default:', q_start)
          new_q = '''        case 2:
            questionTitle(
                "Quelle ambiance veux-tu ?",
                subtitle: "C’est le menu de style du parcours original : Minimaliste, Élégant, Énergique, Luxe, Naturel ou Tech."
            )

            LazyVGrid(columns: [GridItem(.flexible()), GridItem(.flexible())], spacing: 12) {
                ForEach(Array(moodChoices.enumerated()), id: \\.element.id) { index, choice in
                    choiceCard(
                        number: index + 1,
                        title: choice.title,
                        detail: choice.detail,
                        icon: choice.icon,
                        selected: designMood == choice.title
                    ) {
                        HapticService.shared.buttonTap()
                        designMood = choice.title
                    }
                }
            }

            chipSection(title: "Couleur d’accent", options: accentOptions, selection: $accent)

        case 3:
            questionTitle(
                "Quelle direction graphique veux-tu ?",
                subtitle: "Chaque carte modifie réellement la typographie, les formes, les surfaces, les couleurs et le rythme de la maquette."
            )

            VStack(spacing: 12) {
                ForEach(Array(styleChoices.enumerated()), id: \\.element.id) { index, choice in
                    styleCard(
                        number: index + 1,
                        choice: choice,
                        selected: visualStyle == choice.title
                    ) {
                        HapticService.shared.buttonTap()
                        visualStyle = choice.title
                    }
                }
            }

'''
          b = b[:q_start] + new_q + b[q_default:]

          b = b.replace('Button(step == 3 ? "Créer avec Raphaël" : "Continuer")',
                        'Button(step == 4 ? "Créer avec Raphaël" : "Continuer")')
          b = b.replace('if step == 3 {', 'if step == 4 {')

          b = re.sub(r'''        case 2:\n            return !visualStyle\.isEmpty && !accent\.isEmpty\n        default:''', '''        case 2:
            return !designMood.isEmpty && !accent.isEmpty
        case 3:
            return !visualStyle.isEmpty
        default:''', b, count=1)

          b = b.replace('visualStyle: visualStyle,', 'visualStyle: "\\(designMood) · \\(visualStyle)",')

          # Make the restored builder visually match the purple build #502 family.
          b = b.replace('.sarahCyan', '.purple')

          # Expand the style renderer. It intentionally draws inspiration from familiar
          # design systems without copying logos, proprietary assets or page layouts.
          dp_start = b.index('    private func designProfile(style: String, primary: String, secondary: String)')
          dp_end = b.index('    private func accentColors', dp_start)
          new_dp = '''    private func designProfile(style: String, primary: String, secondary: String) -> (themeColor: String, css: String) {
        let normalized = style.lowercased()

        if normalized.contains("google") {
            return (
                "#F8FAFD",
                """
                :root { --primary: #4285F4; --secondary: #34A853; --ink: #202124; --muted: #5f6368; --surface: #ffffff; --soft: #f8fafd; --line: #e1e3e7; }
                body { color: var(--ink); background: radial-gradient(circle at 12% 0%, rgba(66,133,244,.15), transparent 22%), radial-gradient(circle at 82% 4%, rgba(234,67,53,.12), transparent 20%), radial-gradient(circle at 65% 28%, rgba(251,188,5,.11), transparent 18%), var(--soft); font-family: Roboto, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
                .links a { color: var(--muted); padding: 9px 13px; border-radius: 999px; background: #fff; }
                .hero { border-radius: 34px; color: var(--ink); background: linear-gradient(135deg, rgba(66,133,244,.10), rgba(52,168,83,.08) 45%, rgba(251,188,5,.10)); border: 1px solid #e1e3e7; }
                .eyebrow { color: #4285F4; }
                .hero p, .intro, .card p { color: var(--muted); }
                .cta { color: #fff; background: #4285F4; border-radius: 999px; box-shadow: 0 2px 6px rgba(60,64,67,.22); }
                section { border-radius: 28px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 2px 10px rgba(60,64,67,.08); }
                .card { border-radius: 22px; background: #f8fafd; border: 1px solid var(--line); }
                """
            )
        }

        if normalized.contains("tesla") {
            return (
                "#F4F4F4",
                """
                :root { --primary: #111111; --secondary: #666666; --ink: #111111; --muted: #666666; --surface: #ffffff; --soft: #f4f4f4; --line: #dedede; }
                body { color: var(--ink); background: #f4f4f4; font-family: Arial, "Helvetica Neue", sans-serif; }
                .shell { width: min(1280px, 100%); }
                nav { text-transform: uppercase; letter-spacing: .08em; }
                .links a { color: #111; padding: 8px 12px; }
                .hero { min-height: 68vh; display: flex; flex-direction: column; justify-content: flex-end; border-radius: 4px; color: #fff; background: linear-gradient(180deg, #202020 0%, #060606 100%); box-shadow: none; }
                .eyebrow { color: #d8d8d8; }
                .hero p { color: #ededed; }
                .cta { color: #111; background: #fff; border-radius: 3px; text-transform: uppercase; letter-spacing: .05em; }
                section { border-radius: 4px; background: #fff; border: 1px solid var(--line); }
                .intro, .card p { color: var(--muted); }
                .card { border-radius: 3px; background: #f6f6f6; border: 1px solid #e5e5e5; }
                """
            )
        }

        if normalized.contains("microsoft") {
            return (
                "#0F1115",
                """
                :root { --primary: #4CC2FF; --secondary: #0078D4; --ink: #f5f5f5; --muted: #b6bbc4; --surface: rgba(35,38,44,.82); --soft: #111318; --line: rgba(255,255,255,.10); }
                body { color: var(--ink); background: radial-gradient(circle at 85% -10%, rgba(0,120,212,.30), transparent 36%), #0f1115; font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif; }
                .links a { color: #d8dbe0; padding: 8px 11px; border-radius: 8px; background: rgba(255,255,255,.045); }
                .hero { border-radius: 16px; color: #fff; background: linear-gradient(145deg, rgba(255,255,255,.09), rgba(255,255,255,.035)); border: 1px solid var(--line); backdrop-filter: blur(22px); box-shadow: 0 22px 70px rgba(0,0,0,.35); }
                .eyebrow { color: #7fd5ff; }
                .hero p, .intro, .card p { color: var(--muted); }
                .cta { color: #fff; background: #0078D4; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.13), 0 4px 16px rgba(0,0,0,.24); }
                section { border-radius: 14px; background: var(--surface); border: 1px solid var(--line); backdrop-filter: blur(18px); }
                .card { border-radius: 10px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.08); }
                """
            )
        }

        if normalized.contains("stripe") {
            return (
                "#F6F9FC",
                """
                :root { --primary: #635BFF; --secondary: #00D4FF; --ink: #0A2540; --muted: #425466; --surface: rgba(255,255,255,.88); --soft: #f6f9fc; --line: rgba(10,37,64,.10); }
                body { color: var(--ink); background: linear-gradient(140deg, #f6f9fc 0%, #eef4ff 55%, #f9f2ff 100%); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
                .links a { color: var(--ink); padding: 9px 12px; border-radius: 999px; }
                .hero { border-radius: 30px; color: #0A2540; background: linear-gradient(120deg, rgba(99,91,255,.18), rgba(0,212,255,.15), rgba(255,82,191,.12)); border: 1px solid rgba(99,91,255,.14); box-shadow: 0 30px 80px rgba(50,50,93,.13); }
                .eyebrow { color: #635BFF; }
                .hero p, .intro, .card p { color: var(--muted); }
                .cta { color: #fff; background: #635BFF; border-radius: 999px; box-shadow: 0 8px 22px rgba(99,91,255,.26); }
                section { border-radius: 24px; background: var(--surface); border: 1px solid var(--line); box-shadow: 0 14px 40px rgba(50,50,93,.08); }
                .card { border-radius: 18px; background: #fff; border: 1px solid var(--line); }
                """
            )
        }

        if normalized.contains("airbnb") {
            return (
                "#FFFDFC",
                """
                :root { --primary: #FF385C; --secondary: #E31C5F; --ink: #222222; --muted: #717171; --surface: #ffffff; --soft: #fffdfc; --line: #e7e7e7; }
                body { color: var(--ink); background: var(--soft); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
                .links a { color: #222; padding: 10px 14px; border-radius: 999px; background: #fff; border: 1px solid #e7e7e7; }
                .hero { border-radius: 34px; color: #fff; background: linear-gradient(145deg, #4b2730, #b82647 58%, #ff6b81); box-shadow: 0 22px 60px rgba(0,0,0,.14); }
                .eyebrow { color: #ffe6eb; }
                .hero p { color: #fff; }
                .intro, .card p { color: var(--muted); }
                .cta { color: #fff; background: #FF385C; border-radius: 12px; box-shadow: 0 8px 22px rgba(255,56,92,.20); }
                section { border-radius: 26px; background: #fff; border: 1px solid var(--line); }
                .card { border-radius: 20px; background: #fff8f9; border: 1px solid #f2e3e6; }
                """
            )
        }

        if normalized.contains("shopify") {
            return (
                "#F4F7F2",
                """
                :root { --primary: #008060; --secondary: #95BF47; --ink: #202223; --muted: #6D7175; --surface: #ffffff; --soft: #f4f7f2; --line: #dfe3df; }
                body { color: var(--ink); background: var(--soft); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
                .links a { color: #202223; padding: 9px 13px; border-radius: 8px; }
                .hero { border-radius: 22px; color: #fff; background: linear-gradient(135deg, #004c3f, #008060 62%, #95BF47); }
                .eyebrow { color: #d9f7ed; }
                .hero p { color: #effff9; }
                .intro, .card p { color: var(--muted); }
                .cta { color: #004c3f; background: #fff; border-radius: 8px; }
                section { border-radius: 18px; background: #fff; border: 1px solid var(--line); }
                .card { border-radius: 14px; background: #f7faf7; border: 1px solid var(--line); }
                """
            )
        }

        if normalized.contains("notion") {
            return (
                "#FFFFFF",
                """
                :root { --primary: #111111; --secondary: #555555; --ink: #111111; --muted: #6b6b6b; --surface: #ffffff; --soft: #ffffff; --line: #e5e5e5; }
                body { color: var(--ink); background: #fff; font-family: ui-serif, Georgia, "Times New Roman", serif; }
                nav, button, .eyebrow, .card { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
                .links a { color: #333; padding: 6px 9px; border-radius: 5px; }
                .hero { border-radius: 8px; color: #111; background: #fff; border: 1px solid #dedede; box-shadow: 0 8px 26px rgba(0,0,0,.04); }
                .eyebrow { color: #777; }
                .hero p, .intro, .card p { color: var(--muted); }
                .cta { color: #fff; background: #111; border-radius: 5px; }
                section { border-radius: 6px; background: #fff; border: 1px solid var(--line); }
                .card { border-radius: 5px; background: #fafafa; border: 1px solid var(--line); }
                """
            )
        }

        if normalized.contains("linear") {
            return (
                "#08090B",
                """
                :root { --primary: #8B7CFF; --secondary: #5E6AD2; --ink: #f4f4f5; --muted: #9b9ba4; --surface: rgba(18,18,24,.86); --soft: #08090b; --line: rgba(255,255,255,.09); }
                body { color: var(--ink); background: radial-gradient(circle at 50% -12%, rgba(94,106,210,.32), transparent 36%), #08090b; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
                .links a { color: #c8c8d0; padding: 8px 11px; border-radius: 8px; background: rgba(255,255,255,.035); }
                .hero { border-radius: 24px; color: #fff; background: linear-gradient(145deg, rgba(94,106,210,.13), rgba(255,255,255,.025)); border: 1px solid var(--line); box-shadow: 0 30px 90px rgba(0,0,0,.46); }
                .eyebrow { color: #a99fff; }
                .hero p, .intro, .card p { color: var(--muted); }
                .cta { color: #fff; background: linear-gradient(135deg, #5E6AD2, #8B7CFF); border-radius: 9px; }
                section { border-radius: 18px; background: var(--surface); border: 1px solid var(--line); }
                .card { border-radius: 14px; background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); }
