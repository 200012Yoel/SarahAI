                body { color: var(--ink); background: radial-gradient(circle at 12% 0%, rgba(100,210,255,.18), transparent 30%), radial-gradient(circle at 90% 10%, rgba(125,108,255,.17), transparent 30%), #05070a; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif; }
                .links a { color: #eaf8ff; padding: 9px 12px; border-radius: 999px; background: rgba(255,255,255,.045); backdrop-filter: blur(18px); }
                .hero { border-radius: 34px; color: #fff; background: linear-gradient(145deg, rgba(100,210,255,.10), rgba(125,108,255,.07), rgba(255,255,255,.02)); border: 1px solid var(--line); backdrop-filter: blur(28px); box-shadow: 0 32px 90px rgba(0,0,0,.48); }
                .eyebrow { color: #8de3ff; }
                .hero p, .intro, .card p { color: var(--muted); }
                .cta { color: #061018; background: linear-gradient(135deg, #9ee8ff, #b8afff); border-radius: 999px; box-shadow: 0 10px 32px rgba(100,210,255,.20); }
                section { border-radius: 26px; background: var(--surface); border: 1px solid var(--line); backdrop-filter: blur(20px); }
                .card { border-radius: 18px; background: rgba(255,255,255,.045); border: 1px solid rgba(255,255,255,.08); }
                """
