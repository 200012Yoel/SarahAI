        // Apple Premium is the default family.
        return (
            "#000000",
            """
            :root { --primary: \\(primary); --secondary: \\(secondary); --ink: #f5f5f7; --muted: #a1a1a6; --surface: rgba(28,28,30,.78); --soft: #000000; --line: rgba(255,255,255,.12); }
            body { color: var(--ink); background: radial-gradient(circle at 50% -10%, rgba(10,132,255,.18), transparent 34%), #000; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; }
            .links a { color: #e8e8ed; padding: 8px 12px; border-radius: 999px; background: rgba(255,255,255,.055); backdrop-filter: blur(20px); }
            .hero { border-radius: 34px; color: #fff; background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.025)); border: 1px solid var(--line); backdrop-filter: saturate(160%) blur(28px); box-shadow: 0 34px 90px rgba(0,0,0,.42); }
            .eyebrow { color: #7fc7ff; }
            .hero p, .intro, .card p { color: var(--muted); }
            .cta { color: #fff; background: linear-gradient(135deg, \\(primary), \\(secondary)); border-radius: 999px; box-shadow: 0 8px 28px rgba(10,132,255,.22); }
            section { border-radius: 28px; background: var(--surface); border: 1px solid var(--line); backdrop-filter: saturate(140%) blur(22px); }
            .card { border-radius: 20px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.09); }
            """
        )
    }

'''
          b = b[:dp_start] + new_dp + b[dp_end:]

          s = s[:start] + b + s[end:]
          p.write_text(s)

          # 2) Developer-agent routing: accept natural phrases such as
          # "peux-tu me donner l'agent développeur ?" reliably.
          p = root / 'Services/MultiAgentCoordinator.swift'
          s = p.read_text()
          s = s.replace(
              'let estherTokens = ["esther", "ester", "esther code", "raphael", "raphaël", "raph", "rafael"]',
              'let estherTokens = ["l agent developpeur", "le developpeur", "agent developpeur", "developpeur", "agent de codage", "agent code", "esther", "ester", "esther code", "raphael", "raphaël", "raph", "rafael"]'
          )
          s = s.replace(
              'if normalized.contains("esther") || normalized.contains("raphael") ||\n           normalized.contains("code") || normalized.contains("programme") ||',
              'if normalized.contains("esther") || normalized.contains("raphael") ||\n           normalized.contains("agent developpeur") || normalized.contains("developpeur") ||\n           normalized.contains("agent de codage") || normalized.contains("agent code") ||\n           normalized.contains("code") || normalized.contains("programme") ||'
          )
          p.write_text(s)

          # 3) Voice barge-in: keep recognition alive during TTS inside the continuous
          # voice session so the user can say "non", "attends", "stop", etc. and cut in.
          p = root / 'Services/MultiAgentVoiceManager.swift'
          s = p.read_text()
          s = s.replace(
              '        AppleSpeechRecognizer.shared.stopListening()\n        stop()\n        pendingSpeechBlock = nil',
              '        if !AudioSessionManager.shared.isContinuousVoiceSessionActive {\n            AppleSpeechRecognizer.shared.stopListening()\n        }\n        stop()\n        pendingSpeechBlock = nil',
              1
          )
          s = s.replace(
              '        AppleSpeechRecognizer.shared.stopListening()\n        stop()\n\n        let cleanTransition',
              '        if !AudioSessionManager.shared.isContinuousVoiceSessionActive {\n            AppleSpeechRecognizer.shared.stopListening()\n        }\n        stop()\n\n        let cleanTransition',
              1
          )
          p.write_text(s)

          p = root / 'ViewModels/ChatViewModel.swift'
          s = p.read_text()
          old_partial = '''        AppleSpeechRecognizer.shared.onPartialTranscription = { [weak self] partial in
            guard let self = self, self.isContinuousConversationActive else { return }
            self.liveTranscriptionText = partial
        }'''
          new_partial = '''        AppleSpeechRecognizer.shared.onPartialTranscription = { [weak self] partial in
            guard let self = self, self.isContinuousConversationActive else { return }
            let cleanedPartial = partial.trimmingCharacters(in: .whitespacesAndNewlines)
            self.liveTranscriptionText = partial

            // Barge-in façon conversation naturelle : pendant que Sarah parle,
            // une correction explicite de l'utilisateur coupe immédiatement la TTS
            // sans fermer la session AVAudioSession ni le micro.
            if self.voiceManager.isSpeaking, !cleanedPartial.isEmpty {
                let normalized = cleanedPartial
                    .lowercased()
                    .folding(options: .diacriticInsensitive, locale: Locale(identifier: "fr_FR"))
                let words = normalized.split(separator: " ")
                let explicitInterrupt = normalized == "non" ||
                    normalized.hasPrefix("non ") ||
                    normalized.hasPrefix("attends") ||
                    normalized.hasPrefix("attend") ||
                    normalized.hasPrefix("stop") ||
                    normalized.hasPrefix("pardon") ||
                    normalized.hasPrefix("sarah") ||
                    normalized.contains("c est pas ca") ||
                    normalized.contains("ce n est pas ca") ||
                    words.count >= 3

                if explicitInterrupt {
                    self.interruptVoiceResponse()
                    self.liveTranscriptionText = partial
                }
            }
        }'''
          if old_partial not in s:
              raise SystemExit('ChatViewModel partial-transcription block not found')
          s = s.replace(old_partial, new_partial, 1)

          s = s.replace(
              '            self.isSpeaking = true\n            self.isMicRunning = false\n            self.voiceStatus = .speaking',
              '            self.isSpeaking = true\n            self.isMicRunning = AppleSpeechRecognizer.shared.isListening\n            self.voiceStatus = .speaking',
              1
          )

          old_resume = '''                      !self.voiceManager.isSpeaking,
                      !AppleSpeechRecognizer.shared.isListening else { return }
                self.resumeVoiceMicrophone()'''
          new_resume = '''                      !self.voiceManager.isSpeaking else { return }
                if AppleSpeechRecognizer.shared.isListening {
                    self.isMicRunning = true
                    self.voiceStatus = .listening(level: self.micInputLevel)
                    return
                }
                self.resumeVoiceMicrophone()'''
          if old_resume not in s:
              raise SystemExit('ChatViewModel speech-finished resume block not found')
          s = s.replace(old_resume, new_resume, 1)
          p.write_text(s)

          # 4) Mic button: while Sarah is speaking, tapping the mic interrupts Sarah
          # rather than muting the microphone.
          p = root / 'Views/VoiceOrbModalView.swift'
          s = p.read_text()
          old_action = '''                if viewModel.isMicRunning {
                    viewModel.pauseVoiceMicrophone()
                } else {
                    viewModel.resumeVoiceMicrophone()
                }'''
          new_action = '''                if viewModel.isSpeaking {
                    viewModel.interruptVoiceResponse()
                } else if viewModel.isMicRunning {
                    viewModel.pauseVoiceMicrophone()
                } else {
                    viewModel.resumeVoiceMicrophone()
                }'''
          if old_action not in s:
              raise SystemExit('VoiceOrbModalView mic action not found')
          s = s.replace(old_action, new_action, 1)
          s = s.replace(
              '.accessibilityLabel(viewModel.isMicRunning ? "Couper le micro" : "Réactiver le micro")',
              '.accessibilityLabel(viewModel.isSpeaking ? "Interrompre Sarah" : (viewModel.isMicRunning ? "Couper le micro" : "Réactiver le micro"))',
              1
          )
          p.write_text(s)
          PY

