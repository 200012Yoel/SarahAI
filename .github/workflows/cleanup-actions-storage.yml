name: Sarah IA - Purge cache et anciennes compilations

# Une seule purge automatique lors de l'ajout/modification de ce workflow.
# Relancable manuellement depuis Actions > Run workflow.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-actions-storage.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sarah-actions-storage-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Effacer les anciens artefacts Sarah IA (pas les releases)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(mktemp)"
          # Les binaires Android et les releases officielles sont preserves.
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name | test("^(SarahIA|sarah-watch|ios-)"; "i")) | [.id, .name, .size_in_bytes] | @tsv' > "$files"

          deleted=0
          bytes=0
          errors=0
          while IFS=$'\t' read -r id name size; do
            [ -n "$id" ] || continue
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" --silent; then
              echo "Supprime : $name ($id), $size octets"
              deleted=$((deleted + 1))
              bytes=$((bytes + size))
            else
              echo "::warning::Impossible de supprimer l'artefact $name ($id)"
              errors=$((errors + 1))
            fi
          done < "$files"

          echo "Artefacts Sarah supprimes : $deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "Volume logique des artefacts : $bytes octets" >> "$GITHUB_STEP_SUMMARY"
          echo "Erreurs : $errors" >> "$GITHUB_STEP_SUMMARY"
          [ "$errors" -eq 0 ]

      - name: Vider les caches GitHub Actions du depot SarahAI
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          files="$(mktemp)"
          gh api --paginate "repos/$REPO/actions/caches?per_page=100" \
            --jq '.actions_caches[] | [.id, .size_in_bytes] | @tsv' > "$files"

          deleted=0
          bytes=0
          errors=0
          while IFS=$'\t' read -r id size; do
            [ -n "$id" ] || continue
            if gh api -X DELETE "repos/$REPO/actions/caches/$id" --silent; then
              echo "Cache supprime : $id ($size octets)"
              deleted=$((deleted + 1))
              bytes=$((bytes + size))
            else
              echo "::warning::Impossible de supprimer le cache $id"
              errors=$((errors + 1))
            fi
          done < "$files"

          echo "Caches supprimes : $deleted" >> "$GITHUB_STEP_SUMMARY"
          echo "Volume logique des caches : $bytes octets" >> "$GITHUB_STEP_SUMMARY"
          echo "Erreurs : $errors" >> "$GITHUB_STEP_SUMMARY"
          [ "$errors" -eq 0 ]
