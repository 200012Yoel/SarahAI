name: Publish built IPA

on:
  # Pushing this file publishes the build named in RUN_ID below.
  push:
    branches: [claude/sarah-deep-fix]
    paths: ['.github/workflows/publish-ipa.yml']
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID of the successful iOS build run whose SarahIA-IPA artifact to publish'
        required: true
        type: string
      tag:
        description: 'Release tag (the IPA is at releases/download/<tag>/SarahIA.ipa)'
        required: true
        type: string
        default: 'sarah-ia-latest-fix'

env:
  RUN_ID: ${{ inputs.run_id || '38734354068' }}
  TAG: ${{ inputs.tag || 'sarah-ia-latest-fix' }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SarahIA-IPA
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist

      - run: ls -lh dist/SarahIA.ipa

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 'Sarah IA · dernière version corrigée'
          body: 'IPA du run ${{ env.RUN_ID }} (hébreu en direct + file d’attente des traductions). Téléchargement direct : SarahIA.ipa ci-dessous.'
          files: dist/SarahIA.ipa
          overwrite_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
