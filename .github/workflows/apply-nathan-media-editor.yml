name: Apply Nathan Media Editor

on:
  push:
    branches:
      - feature/nathan-media-editor-20260923
    paths:
      - tools/apply_nathan_media_editor.py
      - .github/workflows/apply-nathan-media-editor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout editor branch
        uses: actions/checkout@v4
        with:
          ref: feature/nathan-media-editor-20260923

      - name: Validate patch script
        run: python3 -m py_compile tools/apply_nathan_media_editor.py

      - name: Apply editor and media picker
        run: python3 tools/apply_nathan_media_editor.py

      - name: Normalize Swift files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for raw in [
              "SarahIA/SarahIA/Views/ChatScreenView.swift",
              "SarahIA/SarahIA/ViewModels/ChatViewModel.swift",
          ]:
              path = Path(raw)
              path.write_text(path.read_text(encoding="utf-8").rstrip() + "\n", encoding="utf-8")
          PY

      - name: Validate diff
        run: git diff --check

      - name: Commit editor
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@github.com"
          git add \
            SarahIA/SarahIA/Views/ChatScreenView.swift \
            SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          git commit -m "Add Nathan video editor and real media picker"
          git push origin HEAD:feature/nathan-media-editor-20260923
