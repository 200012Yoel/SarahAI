name: SarahIA iOS launch smoke test

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ios-launch-smoke.yml'

jobs:
  launch-smoke:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick and boot an iPhone simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next((x["udid"] for group in d["devices"].values() for x in group if x.get("isAvailable") and "iPhone" in x.get("name", "")), ""))')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build SarahIA for simulator
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project SarahIA/SarahIA.xcodeproj \
            -scheme SarahIA \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedDataSmoke" \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Install and launch SarahIA
        shell: bash
        run: |
          set -euo pipefail
          UDID='${{ steps.sim.outputs.udid }}'
          APP=$(find "$GITHUB_WORKSPACE/DerivedDataSmoke/Build/Products" -path '*iphonesimulator/SarahIA.app' -type d | head -n 1)
          test -n "$APP"
          xcrun simctl install "$UDID" "$APP"
          LAUNCH_OUTPUT=$(xcrun simctl launch "$UDID" com.sarahia.app)
          echo "$LAUNCH_OUTPUT"
          PID=$(echo "$LAUNCH_OUTPUT" | awk -F': ' 'NF>1 {print $2}' | tail -n 1)
          sleep 8
          if [ -z "$PID" ]; then
            echo "No PID returned by simctl launch" >&2
            exit 1
          fi
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "SarahIA exited during the 8-second cold-launch smoke test" >&2
            xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate 'process == "SarahIA"' || true
            exit 1
          fi
          echo "SarahIA stayed alive after cold launch (PID $PID)."
