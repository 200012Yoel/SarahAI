name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - android-bootstrap
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Local-agent-Sarah-Android-test.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Local-agent-Sarah-Android-test
          path: Local-agent-Sarah-Android-test.apk
          if-no-files-found: error
          retention-days: 14
