name: Trigger SarahIA iOS Build

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/trigger-ios-build.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch validated iOS build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ios-build.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f confirm_release=yes
