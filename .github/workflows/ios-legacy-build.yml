name: 📱 iOS 12 - iPhone 5S & iPhone 6 (Build Legacy)
run-name: 📱 iPhone 5S / iPhone 6 (iOS 12 Build #${{ github.run_number }})

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Identifiant unique du build'
        required: false
        type: string
        default: 'SarahIA-iPhone5S-iOS12'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Xcode version active ==="
          xcodebuild -version

      - name: Prepare iOS 12 Deployment Target (iPhone 5S / 6 / 6+)
        run: |
          echo "=== Configuration MinimumOSVersion 12.0 pour iPhone 5S / iPhone 6 ==="
          find . -name "Info.plist" -not -path "*/SarahIAWidgets/*" -exec plutil -replace MinimumOSVersion -string "12.0" {} \; 2>/dev/null || true

      - name: Build iOS 12 Legacy App (iPhone 5S & 6)
        run: |
          set -o pipefail
          PROJECT_FILE=$(find . -name "*.xcodeproj" -type d | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_NAME=$(basename "$PROJECT_FILE")
          
          cd "$PROJECT_DIR"
          
          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "SarahIA" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=12.0 \
            OTHER_LDFLAGS='-weak_framework SwiftUI -weak_framework Combine -weak_framework WidgetKit' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package Legacy IPA for iPhone 5S & iPhone 6
        run: |
          set -eo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name "SarahIA.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name "*.app" -type d | head -n 1)
          fi

          echo "=== Bundle trouve : $APP_PATH ==="
          rm -rf /tmp/Payload
          mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/

          INFOPLIST_TARGET="/tmp/Payload/$(basename "$APP_PATH")/Info.plist"
          if [ -f "$INFOPLIST_TARGET" ]; then
            plutil -replace MinimumOSVersion -string "12.0" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleIdentifier -string "com.sarahia.app" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleExecutable -string "SarahIA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleName -string "SarahIA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleDisplayName -string "Sarah IA" "$INFOPLIST_TARGET" 2>/dev/null || true
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd /tmp
          zip -ryq "$GITHUB_WORKSPACE/dist/SarahIA-iPhone5S-iOS12.ipa" Payload
          zip -ryq "$GITHUB_WORKSPACE/dist/SarahIA-Legacy-iOS12.ipa" Payload
          zip -ryq "$GITHUB_WORKSPACE/dist/SarahIA.ipa" Payload

          echo "=== Fichiers IPA generes avec succes ==="
          ls -lh "$GITHUB_WORKSPACE/dist/"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-iPhone5S-iOS12
          path: dist/*.ipa
          retention-days: 14

      - name: Publish GitHub Release for iPhone 5S & iPhone 6
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "📱 Sarah IA - iPhone 5S & iPhone 6 (iOS 12.0+ Legacy)"
          body: "Binaire officiel Sarah IA compatible iPhone 5S, iPhone 6, iPhone 6 Plus (iOS 12.0 à 12.5.8) et tous les appareils récents."
          files: |
            dist/SarahIA-iPhone5S-iOS12.ipa
            dist/SarahIA-Legacy-iOS12.ipa
            dist/SarahIA.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
