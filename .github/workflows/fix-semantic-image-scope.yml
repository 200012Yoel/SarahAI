name: Fix Sarah Semantic Image Scope

on:
  push:
    branches:
      - feature/chatgpt-ui-media-shortcuts-20260922
    paths:
      - tools/fix_semantic_image_scope.py
      - .github/workflows/fix-semantic-image-scope.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/chatgpt-ui-media-shortcuts-20260922

      - name: Apply targeted fix
        run: python3 tools/fix_semantic_image_scope.py

      - name: Validate diff
        run: git diff --check

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@github.com"
          git add SarahIA/SarahIA/Services/MultiAgentCoordinator.swift
          git commit -m "Fix semantic image scope in Nathan route"
          git push origin HEAD:feature/chatgpt-ui-media-shortcuts-20260922
