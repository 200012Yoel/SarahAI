name: Canonicalize Whisper runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/canonicalize_whisper_runtime.py'
      - '.github/scripts/enable_whisper_barge_in_canonical.py'
      - '.github/scripts/enhance_whisper_barge_in.py'
      - '.github/workflows/canonicalize-whisper.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical Whisper and UI fixes
        run: |
          set -euo pipefail
          python3 .github/scripts/canonicalize_whisper_runtime.py
          python3 .github/scripts/enable_whisper_barge_in_canonical.py
          python3 .github/scripts/enhance_whisper_barge_in.py

      - name: Verify canonical barge-in source
        run: |
          set -euo pipefail
          grep -q 'WhisperSpeechRecognizer.shared.onVoiceActivity' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'preserveActiveSpeech: true' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'beginContinuousVoiceSession()' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'currentSpokenText' SarahIA/SarahIA/Services/MultiAgentVoiceManager.swift
          grep -q 'consecutiveVoiceChunks >= 2' SarahIA/SarahIA/Services/WhisperService.swift
          grep -q 'setVoiceProcessingEnabled(true)' SarahIA/SarahIA/Services/WhisperService.swift
          echo 'Whisper full-duplex barge-in with iOS echo cancellation verified'

      - name: Commit canonical source
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git config user.name 'SarahIA Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add SarahIA
          git commit -m 'Enable echo-cancelled Whisper barge-in'
          git push origin HEAD:main
