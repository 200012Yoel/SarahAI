name: Nettoyage des anciennes IPA

# Manuel (SUPPRIMER) ou déclenché après publication réussie de l'IPA complète.
# Vérifie la taille du livrable canonique avant de supprimer les anciennes releases.
# Les commits et l'historique de code sont conservés.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Tape SUPPRIMER pour confirmer (action définitive)'
        required: true
        default: ''
      keep_releases:
        description: 'Tags des releases à garder (séparés par des espaces)'
        required: false
        default: 'sarah-ia-latest-fix'
  workflow_run:
    workflows: ["iOS 27 Local AI Build"]
    types: [completed]

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.confirm == 'SUPPRIMER') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      KEEP: ${{ (github.event_name == 'workflow_dispatch' && inputs.keep_releases) || 'sarah-ia-latest-fix' }}
    steps:
      - name: Supprimer les releases (sauf celles à garder) et leurs tags
        run: |
          set -euo pipefail
          full_size=$(gh api "repos/$REPO/releases/tags/sarah-ia-latest-fix" --jq '[.assets[].size] | max // 0')
          if [ "$full_size" -lt 1000000000 ]; then
            echo "Refus du nettoyage : aucune IPA canonique complète."
            exit 1
          fi
          KEEP="sarah-ia-latest-fix $KEEP"
          deleted=0
          gh api --paginate "repos/$REPO/releases?per_page=100" \
            --jq '.[] | "\(.id) \(.tag_name)"' > releases.txt
          while read -r id tag; do
            if [[ " $KEEP " == *" $tag "* ]]; then
              echo "Gardée : $tag"
              continue
            fi
            if gh api -X DELETE "repos/$REPO/releases/$id" --silent; then
              gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" --silent || true
              deleted=$((deleted + 1))
            else
              echo "Échec : $tag"
            fi
          done < releases.txt
          echo "Releases supprimées : $deleted"
