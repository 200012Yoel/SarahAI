name: iOS 27 Local AI Build
run-name: iOS 27 Local AI (Build #${{ github.run_number }})

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Confirmer la compilation et la publication de cette IPA'
        required: false
        type: choice
        options: ['no', 'yes']
        default: 'no'

jobs:
  build:
    if: inputs.confirm_release == 'yes'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Configure build number
        run: |
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace MinimumOSVersion -string "16.2" {} \; 2>/dev/null || true
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace CFBundleVersion -string "${{ github.run_number }}" {} \; 2>/dev/null || true

      - name: Simulator smoke test and crash capture
        run: |
          set -o pipefail
          PROJECT_FILE=$(find . -name "*.xcodeproj" -type d | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_NAME=$(basename "$PROJECT_FILE")
          cd "$PROJECT_DIR"
          rm -rf "$GITHUB_WORKSPACE/SimDerivedData"
          xcodebuild -project "$PROJECT_NAME" -scheme SarahIA -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath "$GITHUB_WORKSPACE/SimDerivedData" IPHONEOS_DEPLOYMENT_TARGET=16.2 CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$GITHUB_WORKSPACE/simulator-build.log"
          APP_PATH=$(find "$GITHUB_WORKSPACE/SimDerivedData" -path '*Debug-iphonesimulator/SarahIA.app' -type d | head -n 1)
          test -n "$APP_PATH"
          xcrun simctl shutdown all >/dev/null 2>&1 || true
          DEVICE=$(xcrun simctl create SarahIA-CI 'iPhone 16' 2>/dev/null || xcrun simctl create SarahIA-CI 'iPhone 15' 2>/dev/null || true)
          if [ -z "$DEVICE" ]; then
            DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for a in d.values() for x in a if x.get("isAvailable")))')
          fi
          xcrun simctl boot "$DEVICE" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP_PATH"
          LOGFILE="$GITHUB_WORKSPACE/runtime.log"
          : > "$LOGFILE"
          (xcrun simctl spawn "$DEVICE" log stream --style compact --level debug --predicate 'process == "SarahIA" OR eventMessage CONTAINS[c] "SarahIA"' > "$LOGFILE" 2>&1) &
          LOGPID=$!
          sleep 2
          set +e
          xcrun simctl launch --console-pty "$DEVICE" com.sarahia.app >> "$LOGFILE" 2>&1 &
          LAUNCHPID=$!
          sleep 15
          xcrun simctl spawn "$DEVICE" launchctl print gui/$(id -u)/com.sarahia.app >> "$LOGFILE" 2>&1
          STATUS=$?
          ps -p "$LAUNCHPID" >/dev/null 2>&1
          kill "$LOGPID" >/dev/null 2>&1 || true
          mkdir -p "$GITHUB_WORKSPACE/crash-reports"
          find "$HOME/Library/Logs/DiagnosticReports" -type f \( -name 'SarahIA*.crash' -o -name 'SarahIA*.ips' \) -exec cp {} "$GITHUB_WORKSPACE/crash-reports/" \; 2>/dev/null || true
          xcrun simctl spawn "$DEVICE" log show --last 2m --style compact --predicate 'process == "SarahIA" OR eventMessage CONTAINS[c] "SarahIA"' >> "$LOGFILE" 2>&1 || true
          set -e
          if grep -Eqi 'crash|fatal error|abort|uncaught exception|dyld|terminated due to|signal 6|signal 11' "$LOGFILE" || [ -n "$(find "$GITHUB_WORKSPACE/crash-reports" -type f -print -quit)" ]; then
            echo 'SarahIA crashed during simulator smoke test.'
            tail -n 300 "$LOGFILE"
            exit 1
          fi
          echo 'Simulator launch survived the smoke-test window.'

      - name: Build device app
        run: |
          PROJECT_FILE=$(find . -name "*.xcodeproj" -type d | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_NAME=$(basename "$PROJECT_FILE")
          cd "$PROJECT_DIR"
          set -o pipefail
          xcodebuild -project "$PROJECT_NAME" -scheme SarahIA -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" IPHONEOS_DEPLOYMENT_TARGET=16.2 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' AD_HOC_CODE_SIGNING_ALLOWED=YES COMPILER_INDEX_STORE_ENABLE=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=NO clean build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name 'SarahIA.app' -type d | head -n 1)
          test -n "$APP_PATH"
          rm -rf /tmp/Payload && mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/
          APP_TARGET_DIR="/tmp/Payload/$(basename "$APP_PATH")"
          if [ -d "$APP_TARGET_DIR/Frameworks" ]; then
            find "$APP_TARGET_DIR/Frameworks" -type d -name '*.framework' -print0 | while IFS= read -r -d '' F; do codesign -f -s - "$F"; done
          fi
          if [ -d "$APP_TARGET_DIR/PlugIns" ]; then
            find "$APP_TARGET_DIR/PlugIns" -type d -name '*.appex' -print0 | while IFS= read -r -d '' E; do codesign -f -s - "$E"; done
          fi
          codesign -f -s - "$APP_TARGET_DIR"
          codesign --verify --deep --strict "$APP_TARGET_DIR"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd /tmp && zip -ryq "$GITHUB_WORKSPACE/dist/SarahIA.ipa" Payload

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-runtime-diagnostics
          path: |
            runtime.log
            simulator-build.log
            xcodebuild.log
            crash-reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-IPA
          path: dist/SarahIA.ipa
          retention-days: 14

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 'Sarah IA - tested build'
          body: 'Build #${{ github.run_number }}. Device build is published only after the simulator launch smoke test succeeds.'
          files: dist/SarahIA.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
