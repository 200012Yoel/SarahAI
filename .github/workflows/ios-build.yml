name: iOS 26 Stable Build
run-name: iOS 26 Stable (Build #${{ github.run_number }})

on:
  push:
    branches:
      - feature/sarah-native-shortcuts-v4
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Confirmer la compilation et la publication de cette IPA'
        required: false
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
jobs:
  build:
    if: github.event_name == 'push' || inputs.confirm_release == 'yes'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 stable
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          echo "=== Xcode Version Active ==="
          xcodebuild -version

      - name: Configure iOS 26 stable Local AI Target
        run: |
          echo "=== Sarah IA moderne : iOS 26 Stable / Local AI ==="
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace MinimumOSVersion -string "16.2" {} \; 2>/dev/null || true
          find . -path "*/SarahIAWidgets/Info.plist" -exec plutil -replace MinimumOSVersion -string "16.2" {} \; 2>/dev/null || true

      - name: Assign a unique build number for this IPA
        run: |
          echo "=== Numéro de build Sarah IA : ${{ github.run_number }} ==="
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace CFBundleVersion -string "${{ github.run_number }}" {} \; 2>/dev/null || true

      - name: Sarah regression guards
        run: |
          set -euo pipefail

          AI="SarahIA/SarahIA/Services/AIService.swift"
          BRAIN="SarahIA/SarahIA/Services/SarahBrainEngine.swift"
          COORD="SarahIA/SarahIA/Services/MultiAgentCoordinator.swift"
          VM="SarahIA/SarahIA/ViewModels/ChatViewModel.swift"

          echo "=== Vérification des régressions critiques Sarah ==="

          if grep -Fq 'SarahBrainEngine.shared.generateStreamingResponse(prompt: formattedChatML)' "$AI"; then
            echo "❌ Régression détectée : le prompt système ChatML est renvoyé au routeur d'intentions."
            exit 1
          fi

          grep -Fq 'sanitizeAssistantOutput' "$VM" || {
            echo "❌ Filtre anti-fuite du prompt interne absent."
            exit 1
          }

          grep -Fq 'hasMediaVerb' "$BRAIN" || {
            echo "❌ Le média peut à nouveau être déclenché par un simple mot-clé."
            exit 1
          }

          grep -Fq 'visualIntent' "$COORD" || {
            echo "❌ Le routage prioritaire de génération d'image a disparu."
            exit 1
          }

          grep -Fq '(self.isShowingVoiceOrbModal || self.isVoiceBubbleVisible)' "$VM" || {
            echo "❌ La lecture vocale automatique n'est plus limitée au mode vocal ou à sa bulle réduite."
            exit 1
          }

          grep -Fq 'isVoiceBubbleVisible' "$VM" || {
            echo "❌ La réduction du mode vocal en bulle a disparu."
            exit 1
          }

          grep -Fq 'MusicModelBackgroundDownloader' "SarahIA/SarahIA/Services/BackgroundModelDownloader.swift" || {
            echo "❌ Le téléchargement musical de fond a disparu."
            exit 1
          }

          grep -Fq 'SarahModelInstallerOverlay' "SarahIA/SarahIA/ContentView.swift" || {
            echo "❌ L'installateur premier lancement a disparu."
            exit 1
          }

          grep -Fq 'let videoIntent = SarahLocalVideoGenEngine.shared.detectVideoIntent(trimmed)' "$COORD" || {
            echo "❌ Le routage vidéo prioritaire a disparu."
            exit 1
          }

          if grep -Fq 'Tous mes modules (mémoire sémantique, vision, musique et calculs) tournent à 100%' "SarahIA/SarahIA/Services/LocalNeuralIntelligenceEngine.swift"; then
            echo "❌ Une ancienne affirmation locale non vérifiée est revenue."
            exit 1
          fi

          grep -Fq 'onRetryUserMessage' "SarahIA/SarahIA/Views/MessageList.swift" || {
            echo "❌ L'action Réitérer des messages utilisateur a disparu."
            exit 1
          }

          grep -Fq 'SarahFullscreenImageViewer' "SarahIA/SarahIA/Views/ChatBubbleView.swift" || {
            echo "❌ Le viewer plein écran des images a disparu."
            exit 1
          }

          grep -Fq 'NSPhotoLibraryAddUsageDescription' "SarahIA/SarahIA/Info.plist" || {
            echo "❌ L'autorisation d'enregistrement dans Photos a disparu."
            exit 1
          }

          grep -Fq 'let musicIntent = SarahLocalMusicGenEngine.shared.detectIntent(trimmed)' "$COORD" || {
            echo "❌ Le routage musical prioritaire a disparu."
            exit 1
          }

          grep -Fq 'generatedAudioURL' "SarahIA/SarahIA/Models/Message.swift" || {
            echo "❌ Les fichiers audio générés ne sont plus persistés dans les messages."
            exit 1
          }

          grep -Fq 'GeneratedAudioFileCardView' "SarahIA/SarahIA/Views/ChatBubbleView.swift" || {
            echo "❌ Le lecteur Stable Audio a disparu du chat."
            exit 1
          }

          grep -Fq 'isComposerDictating' "$VM" || {
            echo "❌ L'état de dictée de la barre de saisie a disparu."
            exit 1
          }

          grep -Fq 'startListening(autoFinalizeOnSilence: false)' "$VM" || {
            echo "❌ La dictée manuelle recommence à se valider toute seule."
            exit 1
          }

          grep -Fq 'alignment: .center' "SarahIA/SarahIA/ContentView.swift" || {
            echo "❌ Le rond vocal réduit n'est plus centré."
            exit 1
          }

          grep -Fq 'noisyDictationCreation' "SarahIA/SarahIA/Services/SarahLocalMusicGenEngine.swift" || {
            echo "❌ La correction des erreurs de dictée musicales a disparu."
            exit 1
          }

          if grep -Fq 'Je n’ai pas de réponse locale suffisamment fiable pour cette demande.' "SarahIA/SarahIA/Services/LocalNeuralIntelligenceEngine.swift"; then
            echo "❌ Le fallback conversationnel technique est revenu."
            exit 1
          fi

          grep -Fq 'fullScreenCover(item: $fullscreenImageItem)' "SarahIA/SarahIA/Views/ChatBubbleView.swift" || {
            echo "❌ Le viewer image peut à nouveau s'ouvrir sans image."
            exit 1
          }

          grep -Fq 'detectRelationshipHints' "SarahIA/SarahIA/Services/OpenSourceImageGenerationService.swift" || {
            echo "❌ Les relations multi-sujets des prompts image ont disparu."
            exit 1
          }

          echo "✅ Garde-fous Sarah validés."

      - name: Build iOS 26 App
        run: |
          PROJECT_FILE=$(find . -name "*.xcodeproj" -type d | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_NAME=$(basename "$PROJECT_FILE")

          cd "$PROJECT_DIR"

          set -o pipefail
          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "SarahIA" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=16.2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_SUPPRESS_WARNINGS=YES \
            clean build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"
          BUILD_EXIT_CODE=$?

          if [ $BUILD_EXIT_CODE -ne 0 ] || grep -q "BUILD FAILED" "$GITHUB_WORKSPACE/xcodebuild.log"; then
            echo "❌ BUILD FAILED DETECTED (Exit code: $BUILD_EXIT_CODE)"
            grep -E "(\.swift:[0-9]+:[0-9]+: error:|error:|fatal error:)" "$GITHUB_WORKSPACE/xcodebuild.log" > "$GITHUB_WORKSPACE/xcode_errors.txt" || true
            if [ ! -s "$GITHUB_WORKSPACE/xcode_errors.txt" ]; then
              tail -n 200 "$GITHUB_WORKSPACE/xcodebuild.log" > "$GITHUB_WORKSPACE/xcode_errors.txt"
            fi
            echo "================================================================"
            echo "=== XCODE ERRORS FOUND IN RUN ==="
            cat "$GITHUB_WORKSPACE/xcode_errors.txt"
            echo "================================================================"
            exit 1
          fi

      - name: Package Universal IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name "SarahIA.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name "*.app" -type d | head -n 1)
          fi

          echo "=== Bundle App Trouve : $APP_PATH ==="
          rm -rf /tmp/Payload
          mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/

          APP_TARGET_DIR="/tmp/Payload/$(basename "$APP_PATH")"

          INFOPLIST_TARGET="$APP_TARGET_DIR/Info.plist"
          if [ -f "$INFOPLIST_TARGET" ]; then
            plutil -replace MinimumOSVersion -string "16.2" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleIdentifier -string "com.sarahia.app" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleExecutable -string "SarahIA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleName -string "SarahIA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleDisplayName -string "Sarah IA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundlePackageType -string "APPL" "$INFOPLIST_TARGET" 2>/dev/null || true
          fi

          # SideStore re-signe l'application avec le compte Apple de l'utilisateur.
          # On publie donc une IPA propre et non pré-signée, comme la branche stable.
          find "$APP_TARGET_DIR" -type d -name "_CodeSignature" -prune -exec rm -rf {} + 2>/dev/null || true
          find "$APP_TARGET_DIR" -name "embedded.mobileprovision" -delete 2>/dev/null || true

          # Validation stricte du bundle avant création de l'IPA.
          MAIN_EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_TARGET_DIR/Info.plist")
          test -n "$MAIN_EXEC"
          test -x "$APP_TARGET_DIR/$MAIN_EXEC"

          if [ -d "$APP_TARGET_DIR/PlugIns" ]; then
            while IFS= read -r -d '' APPEX; do
              APPEX_PLIST="$APPEX/Info.plist"
              EXT_EXEC=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APPEX_PLIST")
              EXT_BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APPEX_PLIST")
              echo "=== Extension : $EXT_BUNDLE / $EXT_EXEC ==="
              test -n "$EXT_EXEC"
              test -x "$APPEX/$EXT_EXEC"
            done < <(find "$APP_TARGET_DIR/PlugIns" -type d -name "*.appex" -print0)
          fi

          echo "=== Structure du Bundle Final dans l'IPA ==="
          find "$APP_TARGET_DIR" -maxdepth 3 -print

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd /tmp
          zip -ryq "$GITHUB_WORKSPACE/dist/SarahIA.ipa" Payload

          echo "=== Vérification de l'archive IPA ==="
          unzip -t "$GITHUB_WORKSPACE/dist/SarahIA.ipa"
          echo "=== Fichier SarahIA.ipa iOS 26 généré avec succès ==="
          ls -lh "$GITHUB_WORKSPACE/dist/SarahIA.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-IPA
          path: dist/SarahIA.ipa
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sarah-ia-4.0-latest
          name: "Sarah IA 4.0 - iOS 26 Stable"
          body: "Build #${{ github.run_number }}. Version Sarah IA 4.0 compilée avec Xcode 26.6 stable, avec nouvelle interface, App Shortcuts natifs et widgets Sarah."
          files: dist/SarahIA.ipa
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log Compilation Diagnostics
        if: failure()
        run: |
          echo "### ❌ Xcode Build Compilation Error Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -s "$GITHUB_WORKSPACE/xcode_errors.txt" ]; then
            cat "$GITHUB_WORKSPACE/xcode_errors.txt" | head -n 100 >> $GITHUB_STEP_SUMMARY
          elif [ -f "$GITHUB_WORKSPACE/xcodebuild.log" ]; then
            grep -E "(\.swift:[0-9]+:[0-9]+: error:|error:|fatal error:)" "$GITHUB_WORKSPACE/xcodebuild.log" | head -n 100 >> $GITHUB_STEP_SUMMARY || tail -n 100 "$GITHUB_WORKSPACE/xcodebuild.log" >> $GITHUB_STEP_SUMMARY
          else
            echo "No xcode logs generated" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Publish Error Release If Failed
        if: failure()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-error-log
          name: "Build Error Diagnostic Log"
          files: |
            ${{ github.workspace }}/xcode_errors.txt
            ${{ github.workspace }}/xcodebuild.log
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            xcode_errors.txt
          retention-days: 3
          if-no-files-found: ignore
