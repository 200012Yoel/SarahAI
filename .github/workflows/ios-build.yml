name: iOS Build
run-name: iOS Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: true
        type: string
      snapshot_ref:
        description: 'Ref holding the working-tree snapshot to build (empty builds this branch)'
        required: false
        type: string
        default: ''
      ios_path:
        description: 'Path to iOS project (e.g., "ios" for React Native)'
        required: false
        type: string
        default: '.'
      scheme:
        description: 'Xcode scheme to build (auto-detected if empty)'
        required: false
        type: string
        default: ''
      use_signing:
        description: 'Enable code signing (requires secrets to be configured)'
        required: false
        type: boolean
        default: false
      configuration:
        description: 'Build configuration (Debug is faster, Release for production)'
        required: false
        type: string
        default: 'Debug'
      flutter_version:
        description: 'Flutter version to use (e.g., 3.24.0). Empty means latest stable.'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout working-tree snapshot
        if: inputs.snapshot_ref != ''
        env:
          SNAPSHOT_REF: ${{ inputs.snapshot_ref }}
        run: |
          set -e
          git fetch --depth=1 origin "+$SNAPSHOT_REF:refs/heads/snapshot"
          git checkout --force snapshot
          echo "Building $(git rev-parse --short HEAD)"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Debug - List project structure
        env:
          IOS_PATH: ${{ inputs.ios_path }}
        run: |
          echo "=== Working directory ==="
          pwd
          echo "=== IOS_PATH = $IOS_PATH ==="
          echo "=== Root listing ==="
          ls -la
          echo "=== IOS_PATH listing ==="
          ls -la "$IOS_PATH/" || echo "IOS_PATH not found!"
          echo "=== Looking for .xcodeproj ==="
          find . -name "*.xcodeproj" -type d 2>/dev/null || true
          echo "=== Looking for schemes ==="
          find . -name "*.xcscheme" -type f 2>/dev/null || true
          echo "=== Xcode version ==="
          xcodebuild -version
          echo "=== Available schemes in IOS_PATH ==="
          cd "$IOS_PATH" 2>/dev/null && xcodebuild -list 2>&1 || echo "xcodebuild -list failed"

      - name: Build App
        env:
          BUILD_ID: ${{ inputs.build_id }}
          IOS_PATH: ${{ inputs.ios_path }}
          SCHEME: ${{ inputs.scheme }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -e

          cd "$IOS_PATH"
          TARGET_SCHEME="${SCHEME:-SarahIA}"

          echo "=== Building $TARGET_SCHEME ==="
          xcodebuild \
            -project SarahIA.xcodeproj \
            -scheme "$TARGET_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

          echo "=== Build completed successfully ==="

      - name: Package IPA
        env:
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -e

          echo "=== Searching for .app bundle ==="
          find "$GITHUB_WORKSPACE/DerivedData" -name "*.app" -type d 2>/dev/null || true

          # Recherche dynamique du binaire .app généré
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name "*.app" -type d | head -n 1 || true)

          if [ -z "$APP_PATH" ]; then
            echo "Erreur : Aucun fichier .app trouve dans DerivedData !"
            echo "=== DerivedData contents ==="
            find "$GITHUB_WORKSPACE/DerivedData" -maxdepth 4 -type d 2>/dev/null || true
            exit 1
          fi

          echo "App trouvee : $APP_PATH"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          mkdir -p "$GITHUB_WORKSPACE/build"
          mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/
          cd /tmp
          zip -rq "$GITHUB_WORKSPACE/dist/SarahIA.ipa" Payload
          zip -rq "$GITHUB_WORKSPACE/build/$BUILD_ID.ipa" Payload
          echo "=== IPA generated successfully ==="
          ls -la "$GITHUB_WORKSPACE/dist/"
          ls -la "$GITHUB_WORKSPACE/build/"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/*.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Publish GitHub Release with Direct Download IPA
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "Sarah AI Latest iOS Build"
          body: "Official build of Sarah AI iOS Application. Download SarahIA.ipa directly."
          files: |
            dist/SarahIA.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 3
          if-no-files-found: ignore

      - name: Save DerivedData cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: DerivedData
          key: deriveddata-${{ github.run_id }}

      - name: Build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID:** ${{ inputs.build_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          if [ -f "$GITHUB_WORKSPACE/xcodebuild.log" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Last 50 lines of xcodebuild output" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 "$GITHUB_WORKSPACE/xcodebuild.log" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
