name: iOS 27 Local AI Build
run-name: iOS 27 Local AI (Build #${{ github.run_number }})

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Confirmer la compilation et la publication de cette IPA'
        required: false
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
  push:
    branches:
      - feature/chatgpt-ui-media-shortcuts-20260922

jobs:
  build:
    if: github.event_name == 'push' || inputs.confirm_release == 'yes'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcodebuild -version

      - name: Configure iOS target and build number
        run: |
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace MinimumOSVersion -string "16.2" {} \; 2>/dev/null || true
          find . -path "*/SarahIAWidgets/Info.plist" -exec plutil -replace MinimumOSVersion -string "16.2" {} \; 2>/dev/null || true
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace CFBundleVersion -string "${{ github.run_number }}" {} \; 2>/dev/null || true

      - name: Build iPhone release
        run: |
          set -eo pipefail
          PROJECT_FILE=$(find . -name "*.xcodeproj" -type d | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_NAME=$(basename "$PROJECT_FILE")
          cd "$PROJECT_DIR"

          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "SarahIA" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=16.2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_SUPPRESS_WARNINGS=YES \
            clean build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Simulator UI regression tests
        run: |
          set -eo pipefail
          PROJECT_FILE=$(find . -name "*.xcodeproj" -type d | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_NAME=$(basename "$PROJECT_FILE")

          SIM_UDID=$(xcrun simctl list devices available | awk '/iPhone/ && /Shutdown/ { gsub(/[()]/, "", $(NF-1)); print $(NF-1); exit }')
          if [ -z "$SIM_UDID" ]; then
            echo "No available iPhone simulator found"
            exit 1
          fi

          xcrun simctl boot "$SIM_UDID" || true
          open -a Simulator --args -CurrentDeviceUDID "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b

          cd "$PROJECT_DIR"
          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "SarahIA" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=$SIM_UDID" \
            -derivedDataPath "$GITHUB_WORKSPACE/SimDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

          SIM_APP=$(find "$GITHUB_WORKSPACE/SimDerivedData" -path "*Debug-iphonesimulator/SarahIA.app" -type d | head -n 1)
          test -n "$SIM_APP"

          mkdir -p "$GITHUB_WORKSPACE/ui-smoke"
          xcrun simctl install "$SIM_UDID" "$SIM_APP"

          RECORDING_PATH="$GITHUB_WORKSPACE/ui-smoke/simulator-session.mp4"
          rm -f "$RECORDING_PATH"
          xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 "$RECORDING_PATH" > /tmp/sarah-simulator-video.log 2>&1 &
          RECORD_PID=$!

          stop_recording() {
            if [ -n "${RECORD_PID:-}" ] && kill -0 "$RECORD_PID" >/dev/null 2>&1; then
              kill -INT "$RECORD_PID" >/dev/null 2>&1 || true
              wait "$RECORD_PID" || true
            fi
          }
          trap stop_recording EXIT

          check_alive() {
            LABEL="$1"
            # Simulator app processes run as normal host processes. `launchctl list`
            # is not a reliable liveness source after opening a UIScene/deep link:
            # the app can remain RunningBoard-active while its launchctl label is
            # absent. Check the actual SarahIA process instead so a live voice UI
            # is not reported as a crash.
            # Xcode 27's simulator can briefly make host-side pgrep return a
            # false negative while a UIScene/deep link is being handed over.
            # Retry against the executable path before declaring a crash.
            ALIVE=0
            for ATTEMPT in 1 2 3 4 5; do
              if ps -ax -o command= | grep -F "/SarahIA.app/SarahIA" | grep -v grep >/dev/null 2>&1; then
                ALIVE=1
                break
              fi
              sleep 1
            done
            if [ "$ALIVE" -ne 1 ]; then
              echo "❌ $LABEL: Sarah IA stopped unexpectedly"
              xcrun simctl spawn "$SIM_UDID" log show --last 2m --style compact \
                --predicate 'process == "SarahIA" OR eventMessage CONTAINS[c] "com.sarahia.app"' \
                | tail -n 500 | tee "$GITHUB_WORKSPACE/simulator_crash.log" || true
              exit 1
            fi
            echo "✅ $LABEL"
          }

          terminate_app() {
            xcrun simctl terminate "$SIM_UDID" com.sarahia.app || true
            sleep 1
          }

          echo "=== 1. Normal launch ==="
          xcrun simctl launch "$SIM_UDID" com.sarahia.app
          sleep 5
          check_alive "Normal launch"
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/ui-smoke/01-normal.png"
          terminate_app

          echo "=== 2. Keyboard composer ==="
          xcrun simctl spawn "$SIM_UDID" defaults write com.apple.keyboard.preferences DidShowContinuousPathIntroduction -bool true || true
          xcrun simctl launch "$SIM_UDID" com.sarahia.app --sarah-ui-smoke-keyboard
          sleep 5
          check_alive "Keyboard composer"
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/ui-smoke/02-keyboard.png"
          terminate_app

          echo "=== 3. Developer handoff ==="
          xcrun simctl launch "$SIM_UDID" com.sarahia.app --sarah-ui-smoke-developer
          sleep 4
          check_alive "Developer handoff"
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/ui-smoke/03-developer.png"
          terminate_app

          echo "=== 4. Complete guided website skill ==="
          xcrun simctl launch "$SIM_UDID" com.sarahia.app --sarah-ui-smoke-developer
          sleep 8
          check_alive "Developer guided flow"
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/ui-smoke/04-developer-complete.png"
          terminate_app

          echo "=== 5. Voice interface ==="
          xcrun simctl privacy "$SIM_UDID" grant microphone com.sarahia.app || true
          xcrun simctl privacy "$SIM_UDID" grant speech-recognition com.sarahia.app || true
          xcrun simctl launch "$SIM_UDID" com.sarahia.app --sarah-ui-smoke-voice
          sleep 8
          check_alive "Voice interface"
          xcrun simctl io "$SIM_UDID" screenshot "$GITHUB_WORKSPACE/ui-smoke/05-voice.png"
          terminate_app

          stop_recording
          trap - EXIT
          test -s "$RECORDING_PATH"
          xcrun simctl shutdown "$SIM_UDID" || true

      - name: Upload simulator screenshots
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-UI-Smoke
          path: ui-smoke/*.png
          retention-days: 3
          if-no-files-found: error

      - name: Upload simulator recording
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-Simulator-Recording
          path: ui-smoke/simulator-session.mp4
          retention-days: 7
          if-no-files-found: error

      - name: Package IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name "SarahIA.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name "*.app" -type d | head -n 1)
          fi
          test -n "$APP_PATH"

          rm -rf /tmp/Payload
          mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/
          APP_TARGET_DIR="/tmp/Payload/$(basename "$APP_PATH")"

          INFOPLIST_TARGET="$APP_TARGET_DIR/Info.plist"
          if [ -f "$INFOPLIST_TARGET" ]; then
            plutil -replace MinimumOSVersion -string "16.2" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleIdentifier -string "com.sarahia.app" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleExecutable -string "SarahIA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleName -string "SarahIA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleDisplayName -string "Sarah IA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundlePackageType -string "APPL" "$INFOPLIST_TARGET" 2>/dev/null || true
          fi

          if [ -d "$APP_TARGET_DIR/Frameworks" ]; then
            find "$APP_TARGET_DIR/Frameworks" -type d -name "*.framework" -print0 | while IFS= read -r -d '' FRAMEWORK; do
              codesign -f -s - "$FRAMEWORK"
            done
          fi

          if [ -d "$APP_TARGET_DIR/PlugIns" ]; then
            find "$APP_TARGET_DIR/PlugIns" -type d -name "*.appex" -print0 | while IFS= read -r -d '' APPEX; do
              codesign -f -s - "$APPEX"
            done
          fi

          codesign -f -s - "$APP_TARGET_DIR"
          codesign --verify --deep --strict "$APP_TARGET_DIR"

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd /tmp
          zip -ryq "$GITHUB_WORKSPACE/dist/SarahIA.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/dist/SarahIA.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-IPA
          path: dist/SarahIA.ipa
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Sarah IA - iOS 27 / Local AI"
          body: "Build #${{ github.run_number }}. Sarah IA avec tests simulateur clavier, voix et parcours développeur avant emballage de l'IPA."
          files: dist/SarahIA.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            simulator_crash.log
          retention-days: 3
          if-no-files-found: ignore
