name: iOS 27 Local AI Build
run-name: iOS 27 Local AI (Build #${{ github.run_number }})

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Confirmer la compilation et la publication de cette IPA'
        required: false
        type: choice
        options: ['no', 'yes']
        default: 'no'
  push:
    branches: [main]
    paths:
      - 'SarahIA/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    if: github.event_name == 'push' || inputs.confirm_release == 'yes'
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Restore missing website voice bridge before compiling
        run: |
          set -euo pipefail
          python3 .github/scripts/restore_website_voice_bridge.py
          grep -q 'public func speakWebsiteGuide(' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'public func speakWebsiteGuideSequence(' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'public func cancelWebsiteGuideSpeech()' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'public func speakSequence(' SarahIA/SarahIA/Services/MultiAgentVoiceManager.swift


      - name: Verify canonical Whisper voice runtime
        run: |
          set -euo pipefail
          grep -q '^import whisper' SarahIA/SarahIA/Services/WhisperService.swift
          grep -q 'whisper_full' SarahIA/SarahIA/Services/WhisperService.swift
          grep -q 'public func prepareModel()' SarahIA/SarahIA/Services/WhisperService.swift
          grep -q 'consecutiveVoiceChunks >= 2' SarahIA/SarahIA/Services/WhisperService.swift
          grep -q 'setVoiceProcessingEnabled(true)' SarahIA/SarahIA/Services/WhisperService.swift
          grep -q 'WhisperService.shared' SarahIA/SarahIA/Services/AppleSpeechRecognizer.swift
          ! grep -q 'SFSpeechRecognizer' SarahIA/SarahIA/Services/AppleSpeechRecognizer.swift
          grep -q 'WhisperSpeechRecognizer.shared.onVoiceActivity' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'preserveActiveSpeech: true' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'beginContinuousVoiceSession()' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'endContinuousVoiceSession()' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'currentSpokenText' SarahIA/SarahIA/Services/MultiAgentVoiceManager.swift
          grep -q '!AudioSessionManager.shared.isContinuousVoiceSessionActive' SarahIA/SarahIA/Services/MultiAgentVoiceManager.swift
          grep -q 'mode: .voiceChat' SarahIA/SarahIA/Services/AudioSessionManager.swift
          echo 'Canonical OpenAI Whisper barge-in + iOS echo cancellation verified'

      - name: Verify translation stack (no call code, no paid service)
        run: |
          set -euo pipefail
          grep -q 'MLKitTranslate' SarahIA/SarahIA/Services/TranslationEngine.swift
          grep -q 'public struct LiveTranslationView' SarahIA/SarahIA/Views/LiveTranslationView.swift
          grep -q 'final class LiveWhisperTranscriber' SarahIA/SarahIA/Services/LiveSpeechTranslationPipeline.swift
          if grep -rq 'WebRTCVoiceCallManager\|VoiceCallContactManager\|WhisperKit' SarahIA/SarahIA; then
            echo 'Code d appel ou WhisperKit encore present'; exit 1
          fi
          if grep -rqi 'deepl\.com\|mymemory' SarahIA/SarahIA; then
            echo 'Service payant encore present'; exit 1
          fi
          echo 'Translation stack verified'

      - name: Verify Raphaël production web generation
        run: |
          set -euo pipefail
          grep -q 'qualitySystemPrompt' SarahIA/SarahIA/Services/VAICodeEngine.swift
          grep -q 'qualityReviewLocalBuild' SarahIA/SarahIA/Services/VAICodeEngine.swift
          grep -q 'qualityReviewRemoteBuild' SarahIA/SarahIA/Services/VAICodeEngine.swift
          grep -q 'duplicateIds' SarahIA/SarahIA/Services/VAICodeEngine.swift
          grep -q 'unlabeledInputs' SarahIA/SarahIA/Services/VAICodeEngine.swift
          grep -q 'validateCandidate(candidate, 2)' SarahIA/SarahIA/Services/VAICodeEngine.swift
          grep -q 'index-r\\(project.revision).html' SarahIA/SarahIA/Services/VAICodeEngine.swift
          grep -q 'SaaS / App' SarahIA/SarahIA/Views/ChatScreenView.swift
          grep -q 'Blog / média' SarahIA/SarahIA/Views/ChatScreenView.swift
          grep -q 'Pipeline : architecture → code → relecture qualité' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'public final class QwenLocalCodeRuntime' SarahIA/SarahIA/Services/AIService.swift
          grep -q 'QwenLocalCodeRuntime.shared.generate' SarahIA/SarahIA/Services/AIService.swift
          grep -q 'llama_model_load_from_file' SarahIA/SarahIA/Services/AIService.swift
          grep -q 'llama_decode' SarahIA/SarahIA/Services/AIService.swift
          ! grep -A100 'public func generateLocalCodeDocument' SarahIA/SarahIA/Services/AIService.swift | grep -q 'LocalNeuralIntelligenceEngine.shared.generateLocalResponse'
          echo 'Raphaël real Qwen3 GGUF + architecture → code → quality review → WebKit repair pipeline verified'

      - name: Build llama.cpp v0.4.1 XCFramework
        run: |
          set -euo pipefail
          LLAMA_ROOT="$RUNNER_TEMP/llama.cpp"
          rm -rf "$LLAMA_ROOT"
          git clone --depth 1 --branch v0.4.1 https://github.com/ggml-org/llama.cpp.git "$LLAMA_ROOT"
          cd "$LLAMA_ROOT"
          ./build-xcframework.sh ios-device
          test -d build-apple/llama.xcframework
          find build-apple/llama.xcframework -maxdepth 3 -type d -name 'llama.framework' -print

      - name: Build whisper.cpp v1.9.4 XCFramework
        run: |
          set -euo pipefail
          WHISPER_ROOT="$RUNNER_TEMP/whisper.cpp"
          rm -rf "$WHISPER_ROOT"
          git clone --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp.git "$WHISPER_ROOT"
          cd "$WHISPER_ROOT"
          ./build-xcframework.sh
          test -d build-apple/whisper.xcframework
          find build-apple/whisper.xcframework -maxdepth 3 -type d -name 'whisper.framework' -print

      - name: Download multilingual OpenAI Whisper base model
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/WhisperModels"
          curl -L --fail --retry 3 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin?download=true' \
            -o "$RUNNER_TEMP/WhisperModels/ggml-base.bin"
          test -s "$RUNNER_TEMP/WhisperModels/ggml-base.bin"
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/openai/whisper/main/LICENSE' \
            -o "$RUNNER_TEMP/WhisperModels/OpenAI-Whisper-MIT.txt"
          cp "$RUNNER_TEMP/whisper.cpp/LICENSE" "$RUNNER_TEMP/WhisperModels/whisper.cpp-MIT.txt"
          cp "$RUNNER_TEMP/llama.cpp/LICENSE" "$RUNNER_TEMP/WhisperModels/llama.cpp-MIT.txt"
          ls -lh "$RUNNER_TEMP/WhisperModels"

      - name: Download on-device Qwen3 1.7B GGUF for complete IPA
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/QwenModels"
          QWEN="$RUNNER_TEMP/QwenModels/Qwen3-1.7B-Q4_K_M.gguf"
          curl -fL --retry 3 --retry-all-errors 'https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q4_K_M.gguf?download=true' -o "$QWEN"
          test "$(stat -f%z "$QWEN")" -ge 1000000000
          test "$(head -c 4 "$QWEN")" = "GGUF"
          curl -fL --retry 3 'https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/main/LICENSE' -o "$RUNNER_TEMP/QwenModels/LICENSE"

      - name: Xcode version
        run: xcodebuild -version

      - name: Install CocoaPods dependencies (Google ML Kit)
        working-directory: SarahIA
        run: |
          set -euo pipefail
          if ! command -v pod >/dev/null 2>&1; then
            sudo gem install cocoapods --no-document
          fi
          pod install --repo-update
          test -d Pods/MLKitTranslate

      - name: Configure build number
        run: |
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace MinimumOSVersion -string "16.2" {} \; 2>/dev/null || true
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace CFBundleVersion -string "${{ github.run_number }}" {} \; 2>/dev/null || true

      - name: Build device app with Whisper and Qwen
        run: |
          set -euo pipefail
          PROJECT_FILE="./SarahIA/SarahIA.xcodeproj"
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_NAME=$(basename "$PROJECT_FILE")

          WHISPER_FRAMEWORK=$(find "$RUNNER_TEMP/whisper.cpp/build-apple/whisper.xcframework" -path '*/ios-arm64/whisper.framework' -type d -print -quit)
          test -n "$WHISPER_FRAMEWORK"
          test "$(basename "$(dirname "$WHISPER_FRAMEWORK")")" = "ios-arm64"
          WHISPER_FRAMEWORK_DIR=$(dirname "$WHISPER_FRAMEWORK")
          echo "Using iPhone Whisper framework: $WHISPER_FRAMEWORK"

          LLAMA_FRAMEWORK=$(find "$RUNNER_TEMP/llama.cpp/build-apple/llama.xcframework" -path '*/ios-arm64/llama.framework' -type d -print -quit)
          test -n "$LLAMA_FRAMEWORK"
          test "$(basename "$(dirname "$LLAMA_FRAMEWORK")")" = "ios-arm64"
          LLAMA_FRAMEWORK_DIR=$(dirname "$LLAMA_FRAMEWORK")
          echo "Using iPhone llama.cpp framework: $LLAMA_FRAMEWORK"

          cd "$PROJECT_DIR"
          WORKSPACE_NAME="${PROJECT_NAME%.xcodeproj}.xcworkspace"
          test -d "$WORKSPACE_NAME"
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE_NAME" \
            -scheme SarahIA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=16.2 \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            CLANG_ENABLE_MODULES=YES \
            FRAMEWORK_SEARCH_PATHS="\$(inherited) $WHISPER_FRAMEWORK_DIR $LLAMA_FRAMEWORK_DIR" \
            OTHER_LDFLAGS='$(inherited) -framework whisper -framework llama -framework Accelerate -framework Metal -framework MetalKit -framework CoreML' \
            LD_RUNPATH_SEARCH_PATHS='$(inherited) @executable_path/Frameworks' \
            build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Summarize compiler errors
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          touch xcodebuild.log
          grep -E 'error:|fatal error' xcodebuild.log | sort -u | head -200 > build-errors.txt
          tail -300 xcodebuild.log > build-tail.txt
          mkdir -p /tmp/cilogs && cp build-errors.txt build-tail.txt /tmp/cilogs/
          cd /tmp/cilogs
          git init -q -b ci-logs-build
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Run ${{ github.run_id }} — commit ${{ github.sha }}" > RUN.txt
          git add -A && git commit -q -m "Erreurs du build ${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-logs-build
          head -60 build-errors.txt

      - name: Bundle local AI frameworks, Whisper model and licenses
        run: |
          set -euo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name 'SarahIA.app' -type d | head -n 1)
          test -n "$APP_PATH"
          mkdir -p "$APP_PATH/WhisperModels"
          cp "$RUNNER_TEMP/WhisperModels/ggml-base.bin" "$APP_PATH/WhisperModels/"
          cp "$RUNNER_TEMP/WhisperModels/OpenAI-Whisper-MIT.txt" "$APP_PATH/WhisperModels/"
          cp "$RUNNER_TEMP/WhisperModels/whisper.cpp-MIT.txt" "$APP_PATH/WhisperModels/"
          cp "$RUNNER_TEMP/WhisperModels/llama.cpp-MIT.txt" "$APP_PATH/WhisperModels/"
          cp "$RUNNER_TEMP/QwenModels/Qwen3-1.7B-Q4_K_M.gguf" "$APP_PATH/"
          cp "$RUNNER_TEMP/QwenModels/LICENSE" "$APP_PATH/Qwen3-Apache-2.0-LICENSE.txt"

          WHISPER_FRAMEWORK=$(find "$RUNNER_TEMP/whisper.cpp/build-apple/whisper.xcframework" -path '*/ios-arm64/whisper.framework' -type d -print -quit)
          test -n "$WHISPER_FRAMEWORK"
          if file "$WHISPER_FRAMEWORK/whisper" | grep -q 'dynamically linked shared library'; then
            mkdir -p "$APP_PATH/Frameworks"
            cp -R "$WHISPER_FRAMEWORK" "$APP_PATH/Frameworks/"
          fi

          LLAMA_FRAMEWORK=$(find "$RUNNER_TEMP/llama.cpp/build-apple/llama.xcframework" -path '*/ios-arm64/llama.framework' -type d -print -quit)
          test -n "$LLAMA_FRAMEWORK"
          if file "$LLAMA_FRAMEWORK/llama" | grep -q 'dynamically linked shared library'; then
            mkdir -p "$APP_PATH/Frameworks"
            cp -R "$LLAMA_FRAMEWORK" "$APP_PATH/Frameworks/"
          fi

          du -sh "$APP_PATH/WhisperModels"

      - name: Package IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name 'SarahIA.app' -type d | head -n 1)
          test -n "$APP_PATH"
          rm -rf /tmp/Payload && mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/
          APP_TARGET_DIR="/tmp/Payload/$(basename "$APP_PATH")"
          if [ -d "$APP_TARGET_DIR/Frameworks" ]; then
            find "$APP_TARGET_DIR/Frameworks" -type d -name '*.framework' -print0 | while IFS= read -r -d '' F; do codesign -f -s - "$F"; done
          fi
          if [ -d "$APP_TARGET_DIR/PlugIns" ]; then
            find "$APP_TARGET_DIR/PlugIns" -type d -name '*.appex' -print0 | while IFS= read -r -d '' E; do codesign -f -s - "$E"; done
          fi
          codesign -f -s - "$APP_TARGET_DIR"
          codesign --verify --deep --strict "$APP_TARGET_DIR"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd /tmp && zip -ryq "$GITHUB_WORKSPACE/dist/SarahIA.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/dist/SarahIA.ipa"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-build-diagnostics
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-IPA
          path: dist/SarahIA.ipa
          retention-days: 14

      - name: Protect canonical IPA from reduced builds
        run: |
          set -euo pipefail
          IPA="$GITHUB_WORKSPACE/dist/SarahIA.ipa"
          test "$(stat -f%z "$IPA")" -ge 1000000000
          unzip -Z -1 "$IPA" | grep '/Qwen3-1.7B-Q4_K_M.gguf$' > /dev/null
          unzip -Z -1 "$IPA" | grep '/WhisperModels/ggml-base.bin$' > /dev/null

      - name: Publish permanent website IPA
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sarah-ia-latest-fix
          name: 'Sarah IA - Version complète unifiée'
          body: 'Build #${{ github.run_number }} : Whisper base multilingue et Qwen3 1.7B GGUF embarqués, MapKit, traduction Apple / Google ML Kit. Les packs linguistiques doivent être téléchargés une première fois.'
          files: dist/SarahIA.ipa
          overwrite_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
