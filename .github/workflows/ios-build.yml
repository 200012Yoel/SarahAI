name: iOS 27 Local AI Build
run-name: iOS 27 Local AI (Build #${{ github.run_number }})

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Confirmer la compilation et la publication de cette IPA'
        required: false
        type: choice
        options: ['no', 'yes']
        default: 'no'

jobs:
  build:
    if: inputs.confirm_release == 'yes'
    runs-on: xcode-27
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify Sarah voice mode wiring
        run: |
          set -e
          test -f SarahIA/SarahIA/Views/VoiceOrbModalView.swift
          grep -q 'fullScreenCover(isPresented: $viewModel.isShowingVoiceOrbModal)' SarahIA/SarahIA/Views/ChatScreenView.swift
          grep -q 'viewModel.isShowingVoiceOrbModal = true' SarahIA/SarahIA/Views/ChatScreenView.swift
          echo 'Sarah voice mode wiring present'

      - name: Xcode version
        run: xcodebuild -version

      - name: Configure build number
        run: |
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace MinimumOSVersion -string "16.2" {} \; 2>/dev/null || true
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace CFBundleVersion -string "${{ github.run_number }}" {} \; 2>/dev/null || true

      - name: Build device app
        run: |
          PROJECT_FILE=$(find . -name "*.xcodeproj" -type d | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_NAME=$(basename "$PROJECT_FILE")
          cd "$PROJECT_DIR"
          set -o pipefail
          xcodebuild -project "$PROJECT_NAME" -scheme SarahIA -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" IPHONEOS_DEPLOYMENT_TARGET=16.2 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' AD_HOC_CODE_SIGNING_ALLOWED=YES COMPILER_INDEX_STORE_ENABLE=NO SWIFT_TREAT_WARNINGS_AS_ERRORS=NO clean build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Package IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name 'SarahIA.app' -type d | head -n 1)
          test -n "$APP_PATH"
          rm -rf /tmp/Payload && mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/
          APP_TARGET_DIR="/tmp/Payload/$(basename "$APP_PATH")"
          if [ -d "$APP_TARGET_DIR/Frameworks" ]; then
            find "$APP_TARGET_DIR/Frameworks" -type d -name '*.framework' -print0 | while IFS= read -r -d '' F; do codesign -f -s - "$F"; done
          fi
          if [ -d "$APP_TARGET_DIR/PlugIns" ]; then
            find "$APP_TARGET_DIR/PlugIns" -type d -name '*.appex' -print0 | while IFS= read -r -d '' E; do codesign -f -s - "$E"; done
          fi
          codesign -f -s - "$APP_TARGET_DIR"
          codesign --verify --deep --strict "$APP_TARGET_DIR"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd /tmp && zip -ryq "$GITHUB_WORKSPACE/dist/SarahIA.ipa" Payload

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-build-diagnostics
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-IPA
          path: dist/SarahIA.ipa
          retention-days: 14

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 'Sarah IA - device build'
          body: 'Build #${{ github.run_number }}. IPA compiled directly for iPhone.'
          files: dist/SarahIA.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}