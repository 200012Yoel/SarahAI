name: iOS Build Universal
run-name: iOS Build Universal (Build #${{ github.run_number }})

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Identifiant unique du build'
        required: false
        type: string
        default: 'SarahIA'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Xcode Version Active ==="
          xcodebuild -version

      - name: Configure Universal iOS 12.0+ Target
        run: |
          echo "=== Normalisation MinimumOSVersion 12.0 dans les Plists ==="
          find . -name "Info.plist" -exec plutil -replace MinimumOSVersion -string "12.0" {} \; 2>/dev/null || true

      - name: Build Universal App Mach-O
        run: |
          PROJECT_FILE=$(find . -name "*.xcodeproj" -type d | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_NAME=$(basename "$PROJECT_FILE")

          cd "$PROJECT_DIR"

          echo "=== Compilation de l'application Sarah IA (Universal iOS 12.0 -> iOS 18.0) ==="
          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "SarahIA" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            build > "$GITHUB_WORKSPACE/xcodebuild.log" 2>&1 || true

          if grep -q "BUILD FAILED" "$GITHUB_WORKSPACE/xcodebuild.log"; then
            echo "❌ BUILD FAILED DETECTED"
            grep -E "(error:|fatal error:)" "$GITHUB_WORKSPACE/xcodebuild.log" | head -n 40 || true
            tail -n 80 "$GITHUB_WORKSPACE/xcodebuild.log"
            exit 1
          fi

      - name: Package Universal IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name "SarahIA.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name "*.app" -type d | head -n 1)
          fi

          echo "=== Bundle App Trouve : $APP_PATH ==="
          rm -rf /tmp/Payload
          mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/

          INFOPLIST_TARGET="/tmp/Payload/$(basename "$APP_PATH")/Info.plist"
          if [ -f "$INFOPLIST_TARGET" ]; then
            plutil -replace MinimumOSVersion -string "12.0" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleIdentifier -string "com.sarahia.app" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleExecutable -string "SarahIA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleName -string "SarahIA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleDisplayName -string "Sarah IA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundlePackageType -string "APPL" "$INFOPLIST_TARGET" 2>/dev/null || true
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd /tmp
          zip -ryq "$GITHUB_WORKSPACE/dist/SarahIA.ipa" Payload

          echo "=== Fichier SarahIA.ipa Universel genere avec succes ==="
          ls -lh "$GITHUB_WORKSPACE/dist/SarahIA.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-IPA
          path: dist/SarahIA.ipa
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Sarah IA - iOS Universal (iOS 12.0+ / iPhone 5S 6 7 8 X 11 12 13 14 15 16)"
          body: "Fichier IPA universel unique compatible iPhone 5S, iPhone 6, iPhone 6 Plus, iPhone 7 et tous les iPhones récents."
          files: dist/SarahIA.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Error Release If Failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-error
          name: "Build Error Log"
          body_path: xcode_errors.txt
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          retention-days: 3
          if-no-files-found: ignore
