name: iOS Build Universal
run-name: iOS Build Universal (Build #${{ github.run_number }})

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Identifiant unique du build'
        required: false
        type: string
        default: 'SarahIA'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "=== Xcode Version Active ==="
          xcodebuild -version

      - name: Configure Universal iOS 12.0+ Target
        run: |
          echo "=== Normalisation des MinimumOSVersion dans les Plists ==="
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace MinimumOSVersion -string "12.0" {} \; 2>/dev/null || true
          find . -path "*/SarahIAWidgets/Info.plist" -exec plutil -replace MinimumOSVersion -string "14.0" {} \; 2>/dev/null || true

      - name: Build Universal App Mach-O
        run: |
          PROJECT_FILE=$(find . -name "*.xcodeproj" -type d | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_NAME=$(basename "$PROJECT_FILE")

          cd "$PROJECT_DIR"

          echo "=== Compilation de l'application Sarah IA (Universal iOS 12.0 -> iOS 18.0) ==="
          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "SarahIA" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            clean build > "$GITHUB_WORKSPACE/xcodebuild.log" 2>&1 || true

          grep -E "(error:|fatal error:)" "$GITHUB_WORKSPACE/xcodebuild.log" > "$GITHUB_WORKSPACE/xcode_errors.txt" || true
          if [ ! -s "$GITHUB_WORKSPACE/xcode_errors.txt" ]; then
            tail -n 100 "$GITHUB_WORKSPACE/xcodebuild.log" > "$GITHUB_WORKSPACE/xcode_errors.txt" || true
          fi

          if grep -q "BUILD FAILED" "$GITHUB_WORKSPACE/xcodebuild.log"; then
            echo "❌ BUILD FAILED DETECTED"
            cat "$GITHUB_WORKSPACE/xcode_errors.txt"
            exit 1
          fi

      - name: Package Universal IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name "SarahIA.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name "*.app" -type d | head -n 1)
          fi

          echo "=== Bundle App Trouve : $APP_PATH ==="
          rm -rf /tmp/Payload
          mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/

          APP_TARGET_DIR="/tmp/Payload/$(basename "$APP_PATH")"

          # Inclusions et vérification de l'extension Widget (.appex) dans PlugIns
          WIDGET_APPEX=$(find "$GITHUB_WORKSPACE/DerivedData" -name "SarahIAWidgets.appex" -type d | head -n 1)
          if [ -n "$WIDGET_APPEX" ]; then
            echo "=== Extension Widget Trouvee : $WIDGET_APPEX ==="
            mkdir -p "$APP_TARGET_DIR/PlugIns"
            rm -rf "$APP_TARGET_DIR/PlugIns/SarahIAWidgets.appex"
            cp -R "$WIDGET_APPEX" "$APP_TARGET_DIR/PlugIns/"
            
            WIDGET_PLIST="$APP_TARGET_DIR/PlugIns/SarahIAWidgets.appex/Info.plist"
            if [ -f "$WIDGET_PLIST" ]; then
              plutil -replace MinimumOSVersion -string "12.0" "$WIDGET_PLIST" 2>/dev/null || true
              plutil -replace CFBundleIdentifier -string "com.sarahia.app.SarahIAWidgets" "$WIDGET_PLIST" 2>/dev/null || true
              plutil -replace CFBundleExecutable -string "SarahIAWidgets" "$WIDGET_PLIST" 2>/dev/null || true
              plutil -replace CFBundlePackageType -string "XPC!" "$WIDGET_PLIST" 2>/dev/null || true
            fi
          fi

          INFOPLIST_TARGET="$APP_TARGET_DIR/Info.plist"
          if [ -f "$INFOPLIST_TARGET" ]; then
            plutil -replace MinimumOSVersion -string "12.0" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleIdentifier -string "com.sarahia.app" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleExecutable -string "SarahIA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleName -string "SarahIA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleDisplayName -string "Sarah IA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundlePackageType -string "APPL" "$INFOPLIST_TARGET" 2>/dev/null || true
          fi

          echo "=== Structure du Bundle Final dans l'IPA ==="
          ls -la "$APP_TARGET_DIR"
          if [ -d "$APP_TARGET_DIR/PlugIns" ]; then
            ls -la "$APP_TARGET_DIR/PlugIns"
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd /tmp
          zip -ryq "$GITHUB_WORKSPACE/dist/SarahIA.ipa" Payload

          echo "=== Fichier SarahIA.ipa Universel genere avec succes ==="
          ls -lh "$GITHUB_WORKSPACE/dist/SarahIA.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-IPA
          path: dist/SarahIA.ipa
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest
          name: "Sarah IA - iOS Universal (iOS 12.0+ / iPhone 5S 6 7 8 X 11 12 13 14 15 16)"
          body: "Fichier IPA universel unique compatible iPhone 5S, iPhone 6, iPhone 6 Plus, iPhone 7 et tous les iPhones récents."
          files: dist/SarahIA.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Error Release If Failed
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Sarah IA - Build Diagnostic Logs"
          body_path: xcode_errors.txt
          files: |
            xcode_errors.txt
            xcodebuild.log
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            xcode_errors.txt
          retention-days: 3
          if-no-files-found: ignore
