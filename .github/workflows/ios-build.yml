name: iOS 27 Local AI Build
run-name: iOS 27 Local AI (Build #${{ github.run_number }})

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Confirmer la compilation et la publication de cette IPA'
        required: false
        type: choice
        options: ['no', 'yes']
        default: 'no'
  push:
    branches: [main]
    paths:
      - 'SarahIA/**'
      - '.github/workflows/ios-build.yml'

jobs:
  build:
    if: github.event_name == 'push' || inputs.confirm_release == 'yes'
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical Whisper voice runtime
        run: |
          set -euo pipefail
          grep -q '^import whisper' SarahIA/SarahIA/Services/WhisperService.swift
          grep -q 'whisper_full' SarahIA/SarahIA/Services/WhisperService.swift
          grep -q 'public func prepareModel()' SarahIA/SarahIA/Services/WhisperService.swift
          grep -q 'consecutiveVoiceChunks >= 2' SarahIA/SarahIA/Services/WhisperService.swift
          grep -q 'setVoiceProcessingEnabled(true)' SarahIA/SarahIA/Services/WhisperService.swift
          grep -q 'WhisperService.shared' SarahIA/SarahIA/Services/AppleSpeechRecognizer.swift
          ! grep -q 'SFSpeechRecognizer' SarahIA/SarahIA/Services/AppleSpeechRecognizer.swift
          grep -q 'WhisperSpeechRecognizer.shared.onVoiceActivity' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'preserveActiveSpeech: true' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'beginContinuousVoiceSession()' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'endContinuousVoiceSession()' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          grep -q 'currentSpokenText' SarahIA/SarahIA/Services/MultiAgentVoiceManager.swift
          grep -q '!AudioSessionManager.shared.isContinuousVoiceSessionActive' SarahIA/SarahIA/Services/MultiAgentVoiceManager.swift
          grep -q 'mode: .voiceChat' SarahIA/SarahIA/Services/AudioSessionManager.swift
          echo 'Canonical OpenAI Whisper barge-in + iOS echo cancellation verified'

      - name: Verify Raphaël production web generation
        run: |
          set -euo pipefail
          grep -q 'qualitySystemPrompt' SarahIA/SarahIA/Services/VAICodeEngine.swift
          grep -q 'qualityReviewLocalBuild' SarahIA/SarahIA/Services/VAICodeEngine.swift
          grep -q 'qualityReviewRemoteBuild' SarahIA/SarahIA/Services/VAICodeEngine.swift
          grep -q 'duplicateIds' SarahIA/SarahIA/Services/VAICodeEngine.swift
          grep -q 'unlabeledInputs' SarahIA/SarahIA/Services/VAICodeEngine.swift
          grep -q 'validateCandidate(candidate, 2)' SarahIA/SarahIA/Services/VAICodeEngine.swift
          grep -q 'index-r\\(project.revision).html' SarahIA/SarahIA/Services/VAICodeEngine.swift
          grep -q 'setVoiceProcessingEnabled(true)' SarahIA/SarahIA/Services/WhisperService.swift
          grep -q 'SaaS / App' SarahIA/SarahIA/Views/ChatScreenView.swift
          grep -q 'Blog / média' SarahIA/SarahIA/Views/ChatScreenView.swift
          grep -q 'Pipeline : architecture → code → relecture qualité' SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          echo 'Raphaël architecture → implementation → quality review → WebKit repair pipeline verified'

      - name: Build whisper.cpp v1.9.4 XCFramework
        run: |
          set -euo pipefail
          WHISPER_ROOT="$RUNNER_TEMP/whisper.cpp"
          rm -rf "$WHISPER_ROOT"
          git clone --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp.git "$WHISPER_ROOT"
          cd "$WHISPER_ROOT"
          ./build-xcframework.sh
          test -d build-apple/whisper.xcframework
          find build-apple/whisper.xcframework -maxdepth 3 -type d -name 'whisper.framework' -print

      - name: Download multilingual OpenAI Whisper base model
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/WhisperModels"
          curl -L --fail --retry 3 \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin?download=true' \
            -o "$RUNNER_TEMP/WhisperModels/ggml-base.bin"
          test -s "$RUNNER_TEMP/WhisperModels/ggml-base.bin"
          curl -L --fail --retry 3 \
            'https://raw.githubusercontent.com/openai/whisper/main/LICENSE' \
            -o "$RUNNER_TEMP/WhisperModels/OpenAI-Whisper-MIT.txt"
          cp "$RUNNER_TEMP/whisper.cpp/LICENSE" "$RUNNER_TEMP/WhisperModels/whisper.cpp-MIT.txt"
          ls -lh "$RUNNER_TEMP/WhisperModels"

      - name: Xcode version
        run: xcodebuild -version

      - name: Configure build number
        run: |
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace MinimumOSVersion -string "16.2" {} \; 2>/dev/null || true
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace CFBundleVersion -string "${{ github.run_number }}" {} \; 2>/dev/null || true

      - name: Build device app with Whisper
        run: |
          set -euo pipefail
          PROJECT_FILE=$(find . -name "*.xcodeproj" -type d | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_NAME=$(basename "$PROJECT_FILE")
          WHISPER_FRAMEWORK=$(find "$RUNNER_TEMP/whisper.cpp/build-apple/whisper.xcframework" -path '*/ios-arm64/whisper.framework' -type d -print -quit)
          test -n "$WHISPER_FRAMEWORK"
          test "$(basename "$(dirname "$WHISPER_FRAMEWORK")")" = "ios-arm64"
          WHISPER_FRAMEWORK_DIR=$(dirname "$WHISPER_FRAMEWORK")
          echo "Using iPhone Whisper framework: $WHISPER_FRAMEWORK"
          cd "$PROJECT_DIR"
          set -o pipefail
          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme SarahIA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=16.2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            CLANG_ENABLE_MODULES=YES \
            FRAMEWORK_SEARCH_PATHS="$WHISPER_FRAMEWORK_DIR" \
            OTHER_LDFLAGS='$(inherited) -framework whisper -framework Accelerate -framework Metal -framework CoreML' \
            LD_RUNPATH_SEARCH_PATHS='$(inherited) @executable_path/Frameworks' \
            clean build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"
          grep -q '\*\* BUILD SUCCEEDED \*\*' "$GITHUB_WORKSPACE/xcodebuild.log"

      - name: Bundle Whisper model and licenses
        run: |
          set -euo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name 'SarahIA.app' -type d | head -n 1)
          test -n "$APP_PATH"
          mkdir -p "$APP_PATH/WhisperModels"
          cp "$RUNNER_TEMP/WhisperModels/ggml-base.bin" "$APP_PATH/WhisperModels/"
          cp "$RUNNER_TEMP/WhisperModels/OpenAI-Whisper-MIT.txt" "$APP_PATH/WhisperModels/"
          cp "$RUNNER_TEMP/WhisperModels/whisper.cpp-MIT.txt" "$APP_PATH/WhisperModels/"

          WHISPER_FRAMEWORK=$(find "$RUNNER_TEMP/whisper.cpp/build-apple/whisper.xcframework" -path '*/ios-arm64/whisper.framework' -type d -print -quit)
          test -n "$WHISPER_FRAMEWORK"
          if file "$WHISPER_FRAMEWORK/whisper" | grep -q 'dynamically linked shared library'; then
            mkdir -p "$APP_PATH/Frameworks"
            cp -R "$WHISPER_FRAMEWORK" "$APP_PATH/Frameworks/"
          fi
          du -sh "$APP_PATH/WhisperModels"

      - name: Package IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name 'SarahIA.app' -type d | head -n 1)
          test -n "$APP_PATH"
          rm -rf /tmp/Payload && mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/
          APP_TARGET_DIR="/tmp/Payload/$(basename "$APP_PATH")"
          if [ -d "$APP_TARGET_DIR/Frameworks" ]; then
            find "$APP_TARGET_DIR/Frameworks" -type d -name '*.framework' -print0 | while IFS= read -r -d '' F; do codesign -f -s - "$F"; done
          fi
          if [ -d "$APP_TARGET_DIR/PlugIns" ]; then
            find "$APP_TARGET_DIR/PlugIns" -type d -name '*.appex' -print0 | while IFS= read -r -d '' E; do codesign -f -s - "$E"; done
          fi
          codesign -f -s - "$APP_TARGET_DIR"
          codesign --verify --deep --strict "$APP_TARGET_DIR"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd /tmp && zip -ryq "$GITHUB_WORKSPACE/dist/SarahIA.ipa" Payload
          ls -lh "$GITHUB_WORKSPACE/dist/SarahIA.ipa"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-build-diagnostics
          path: xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-IPA
          path: dist/SarahIA.ipa
          retention-days: 14

      - name: Publish permanent website IPA
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sarah-ia-4.0-latest
          name: 'Sarah IA 4.0 - iOS 26 Stable'
          body: 'Latest Sarah IA device build. Build #${{ github.run_number }}. Canonical OpenAI Whisper with barge-in/AEC plus Raphaël production-grade agentic website generation and WebKit quality gates.'
          files: dist/SarahIA.ipa
          overwrite_files: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
