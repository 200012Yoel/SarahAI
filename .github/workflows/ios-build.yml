name: iOS Build
run-name: iOS Build ${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: 'Unique build identifier'
        required: true
        type: string
      snapshot_ref:
        description: 'Ref holding the working-tree snapshot to build (empty builds this branch)'
        required: false
        type: string
        default: ''
      ios_path:
        description: 'Path to iOS project (e.g., "ios" for React Native)'
        required: false
        type: string
        default: '.'
      scheme:
        description: 'Xcode scheme to build (auto-detected if empty)'
        required: false
        type: string
        default: ''
      use_signing:
        description: 'Enable code signing (requires secrets to be configured)'
        required: false
        type: boolean
        default: false
      configuration:
        description: 'Build configuration (Debug is faster, Release for production)'
        required: false
        type: string
        default: 'Debug'
      flutter_version:
        description: 'Flutter version to use (e.g., 3.24.0). Empty means latest stable.'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The dispatch always runs the workflow from the default branch, so the
      # sources come from a snapshot ref pushed by the CLI instead.
      - name: Checkout working-tree snapshot
        if: inputs.snapshot_ref != ''
        env:
          SNAPSHOT_REF: ${{ inputs.snapshot_ref }}
        run: |
          set -e
          git fetch --depth=1 origin "+$SNAPSHOT_REF:refs/heads/snapshot"
          git checkout --force snapshot
          echo "Building $(git rev-parse --short HEAD)"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Restore DerivedData cache
        uses: actions/cache/restore@v4
        id: cache-deriveddata
        with:
          path: DerivedData
          key: deriveddata-${{ github.run_id }}
          restore-keys: |
            deriveddata-

      - name: Detect project type
        id: detect
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "type=flutter" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ] && grep -q '"expo"' package.json; then
            echo "type=expo" >> $GITHUB_OUTPUT
          elif [ -f "package.json" ] && grep -q '"react-native"' package.json; then
            echo "type=reactnative" >> $GITHUB_OUTPUT
          else
            echo "type=native" >> $GITHUB_OUTPUT
          fi

      - name: Generate Xcode project (XcodeGen)
        env:
          IOS_PATH: ${{ inputs.ios_path }}
        run: |
          set -e
          cd "$IOS_PATH"

          # Projects generated by XcodeGen usually keep the .xcodeproj out of git,
          # so the checkout has a project.yml manifest but nothing to build.
          MANIFEST=""
          for f in project.yml project.yaml; do
            if [ -f "$f" ] && grep -qE '^targets:' "$f"; then
              MANIFEST="$f"
              break
            fi
          done

          if [ -z "$MANIFEST" ]; then
            echo "No XcodeGen manifest — skipping."
          elif [ -n "$(find . -maxdepth 1 -name '*.xcodeproj' -print -quit)" ]; then
            echo "Found a committed .xcodeproj — skipping generation."
          else
            echo "Found $MANIFEST and no .xcodeproj — generating with XcodeGen."
            brew install xcodegen
            xcodegen generate
          fi

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version || '' }}
          channel: ${{ inputs.flutter_version && 'stable' || 'stable' }}
          cache: true

      - name: Flutter pub get
        if: steps.detect.outputs.type == 'flutter'
        run: flutter pub get

      - name: Setup Node.js
        if: steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        if: steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo'
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json', 'yarn.lock') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install npm dependencies
        if: (steps.detect.outputs.type == 'reactnative' || steps.detect.outputs.type == 'expo') && steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Restore Pods cache
        uses: actions/cache@v4
        id: pods-cache
        with:
          path: |
            ${{ inputs.ios_path }}/Pods
            ~/.cocoapods/repos
          key: pods-${{ runner.os }}-${{ hashFiles(format('{0}/Podfile.lock', inputs.ios_path)) }}
          restore-keys: |
            pods-${{ runner.os }}-

      - name: Install certificate and provisioning profile
        if: inputs.use_signing
        env:
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -e

          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$IOS_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Install provisioning profile
          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$IOS_PROVISIONING_PROFILE" | base64 --decode > "$PROFILE_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PROFILE_PLIST=$RUNNER_TEMP/profile.plist
          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(plutil -extract UUID raw -o - "$PROFILE_PLIST")
          cp "$PROFILE_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PROFILE_UUID".mobileprovision

          TEAM_ID=$(plutil -extract TeamIdentifier.0 raw -o - "$PROFILE_PLIST")
          PROFILE_NAME=$(plutil -extract Name raw -o - "$PROFILE_PLIST")
          APP_ID=$(plutil -extract Entitlements.application-identifier raw -o - "$PROFILE_PLIST")
          PROFILE_BUNDLE_ID=${APP_ID#"$TEAM_ID".}

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
          echo "DEVELOPMENT_TEAM=$TEAM_ID" >> $GITHUB_ENV
          echo "PROVISIONING_PROFILE_NAME=$PROFILE_NAME" >> $GITHUB_ENV

      - name: Build IPA
        env:
          BUILD_ID: ${{ inputs.build_id }}
          IOS_PATH: ${{ inputs.ios_path }}
          SCHEME: ${{ inputs.scheme }}
          PROJECT_TYPE: ${{ steps.detect.outputs.type }}
          USE_SIGNING: ${{ inputs.use_signing }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          set -e

          # Navigate to iOS project directory
          cd "$IOS_PATH"

          # Determine project or workspace
          PROJECT=$(find . -maxdepth 1 -name "*.xcodeproj" | head -1)
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -1)
          
          # Scheme name fallback
          TARGET_SCHEME="${SCHEME:-SarahIA}"
          
          mkdir -p "$GITHUB_WORKSPACE/build"
          
          echo "Executing xcodebuild archive..."
          if [ -n "$WORKSPACE" ] && [ -f "Podfile" ]; then
            xcodebuild archive \
              -workspace "$WORKSPACE" \
              -scheme "$TARGET_SCHEME" \
              -configuration "$CONFIGURATION" \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
              -archivePath "$GITHUB_WORKSPACE/build/App.xcarchive" \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              COMPILER_INDEX_STORE_ENABLE=NO
          else
            xcodebuild archive \
              -project "${PROJECT:-SarahIA.xcodeproj}" \
              -scheme "$TARGET_SCHEME" \
              -configuration "$CONFIGURATION" \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
              -archivePath "$GITHUB_WORKSPACE/build/App.xcarchive" \
              CODE_SIGN_IDENTITY="-" \
              CODE_SIGNING_REQUIRED=NO \
              AD_HOC_CODE_SIGNING_ALLOWED=YES \
              COMPILER_INDEX_STORE_ENABLE=NO
          fi

          # Create IPA package
          cd "$GITHUB_WORKSPACE"
          APP_PATH=$(find "$GITHUB_WORKSPACE/build/App.xcarchive/Products/Applications" -name "*.app" -type d | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app in archive"
            exit 1
          fi

          echo "Found app bundle at: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -rq "$BUILD_ID.ipa" Payload
          rm -rf Payload
          echo "Successfully created IPA: build/$BUILD_ID.ipa"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/*.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Save DerivedData cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: DerivedData
          key: deriveddata-${{ github.run_id }}

      - name: Cleanup signing
        if: always() && inputs.use_signing
        run: |
          if [ -n "$KEYCHAIN_PATH" ] && [ -f "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH" || true
          fi

      - name: Build summary
        if: always()
        env:
          USE_SIGNING: ${{ inputs.use_signing }}
          CONFIGURATION: ${{ inputs.configuration }}
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build ID:** ${{ inputs.build_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration:** $CONFIGURATION" >> $GITHUB_STEP_SUMMARY
          if [ -f build/*.ipa ]; then
            IPA_PATH=$(find build -name "*.ipa" -type f | head -1)
            echo "- **IPA Size:** $(ls -lh "$IPA_PATH" | awk '{print $5}')" >> $GITHUB_STEP_SUMMARY
          fi
