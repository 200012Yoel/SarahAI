name: iOS 26 Stable Build
run-name: iOS 26 Stable (Build #${{ github.run_number }})

on:
  push:
    branches:
      - feature/sarah-native-shortcuts-v4
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Confirmer la compilation et la publication de cette IPA'
        required: false
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'
jobs:
  build:
    if: github.event_name == 'push' || inputs.confirm_release == 'yes'
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.6 stable
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
          echo "=== Xcode Version Active ==="
          xcodebuild -version

      - name: Configure iOS 26 stable Local AI Target
        run: |
          echo "=== Sarah IA moderne : iOS 26 Stable / Local AI ==="
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace MinimumOSVersion -string "16.2" {} \; 2>/dev/null || true
          find . -path "*/SarahIAWidgets/Info.plist" -exec plutil -replace MinimumOSVersion -string "16.2" {} \; 2>/dev/null || true

      - name: Assign a unique build number for this IPA
        run: |
          echo "=== Numéro de build Sarah IA : ${{ github.run_number }} ==="
          find . -path "*/SarahIA/Info.plist" -exec plutil -replace CFBundleVersion -string "${{ github.run_number }}" {} \; 2>/dev/null || true

      - name: Build iOS 26 App
        run: |
          PROJECT_FILE=$(find . -name "*.xcodeproj" -type d | head -n 1)
          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          PROJECT_NAME=$(basename "$PROJECT_FILE")

          cd "$PROJECT_DIR"

          set -o pipefail
          xcodebuild \
            -project "$PROJECT_NAME" \
            -scheme "SarahIA" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$GITHUB_WORKSPACE/DerivedData" \
            IPHONEOS_DEPLOYMENT_TARGET=16.2 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=NO \
            SWIFT_SUPPRESS_WARNINGS=YES \
            clean build 2>&1 | tee "$GITHUB_WORKSPACE/xcodebuild.log"
          BUILD_EXIT_CODE=$?

          if [ $BUILD_EXIT_CODE -ne 0 ] || grep -q "BUILD FAILED" "$GITHUB_WORKSPACE/xcodebuild.log"; then
            echo "❌ BUILD FAILED DETECTED (Exit code: $BUILD_EXIT_CODE)"
            grep -E "(\.swift:[0-9]+:[0-9]+: error:|error:|fatal error:)" "$GITHUB_WORKSPACE/xcodebuild.log" > "$GITHUB_WORKSPACE/xcode_errors.txt" || true
            if [ ! -s "$GITHUB_WORKSPACE/xcode_errors.txt" ]; then
              tail -n 200 "$GITHUB_WORKSPACE/xcodebuild.log" > "$GITHUB_WORKSPACE/xcode_errors.txt"
            fi
            echo "================================================================"
            echo "=== XCODE ERRORS FOUND IN RUN ==="
            cat "$GITHUB_WORKSPACE/xcode_errors.txt"
            echo "================================================================"
            exit 1
          fi

      - name: Package Universal IPA
        run: |
          set -eo pipefail
          APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name "SarahIA.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "$GITHUB_WORKSPACE/DerivedData" -name "*.app" -type d | head -n 1)
          fi

          echo "=== Bundle App Trouve : $APP_PATH ==="
          rm -rf /tmp/Payload
          mkdir -p /tmp/Payload
          cp -R "$APP_PATH" /tmp/Payload/

          APP_TARGET_DIR="/tmp/Payload/$(basename "$APP_PATH")"

          INFOPLIST_TARGET="$APP_TARGET_DIR/Info.plist"
          if [ -f "$INFOPLIST_TARGET" ]; then
            plutil -replace MinimumOSVersion -string "16.2" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleIdentifier -string "com.sarahia.app" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleExecutable -string "SarahIA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleName -string "SarahIA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundleDisplayName -string "Sarah IA" "$INFOPLIST_TARGET" 2>/dev/null || true
            plutil -replace CFBundlePackageType -string "APPL" "$INFOPLIST_TARGET" 2>/dev/null || true
          fi

          # Signer d'abord tous les composants imbriqués, puis le bundle principal.
          # Une dépendance dynamique non signée peut provoquer une fermeture immédiate au lancement.
          if [ -d "$APP_TARGET_DIR/Frameworks" ]; then
            find "$APP_TARGET_DIR/Frameworks" -type d -name "*.framework" -print0 | while IFS= read -r -d '' FRAMEWORK; do
              codesign -f -s - "$FRAMEWORK"
            done
          fi

          if [ -d "$APP_TARGET_DIR/PlugIns" ]; then
            find "$APP_TARGET_DIR/PlugIns" -type d -name "*.appex" -print0 | while IFS= read -r -d '' APPEX; do
              codesign -f -s - "$APPEX"
            done
          fi

          codesign -f -s - "$APP_TARGET_DIR"
          codesign --verify --deep --strict "$APP_TARGET_DIR"

          echo "=== Structure du Bundle Final dans l'IPA ==="
          ls -la "$APP_TARGET_DIR"
          if [ -d "$APP_TARGET_DIR/PlugIns" ]; then
            ls -la "$APP_TARGET_DIR/PlugIns"
          fi

          mkdir -p "$GITHUB_WORKSPACE/dist"
          cd /tmp
          zip -ryq "$GITHUB_WORKSPACE/dist/SarahIA.ipa" Payload

          echo "=== Fichier SarahIA.ipa iOS 26 genere avec succes ==="
          ls -lh "$GITHUB_WORKSPACE/dist/SarahIA.ipa"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SarahIA-IPA
          path: dist/SarahIA.ipa
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/feature/sarah-native-shortcuts-v4'
        with:
          tag_name: sarah-ia-4.0-latest
          name: "Sarah IA 4.0 - iOS 26 Stable"
          body: "Build #${{ github.run_number }}. Version Sarah IA 4.0 compilée avec Xcode 26.6 stable, avec nouvelle interface, App Shortcuts natifs et widgets Sarah."
          files: dist/SarahIA.ipa
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log Compilation Diagnostics
        if: failure()
        run: |
          echo "### ❌ Xcode Build Compilation Error Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          if [ -s "$GITHUB_WORKSPACE/xcode_errors.txt" ]; then
            cat "$GITHUB_WORKSPACE/xcode_errors.txt" | head -n 100 >> $GITHUB_STEP_SUMMARY
          elif [ -f "$GITHUB_WORKSPACE/xcodebuild.log" ]; then
            grep -E "(\.swift:[0-9]+:[0-9]+: error:|error:|fatal error:)" "$GITHUB_WORKSPACE/xcodebuild.log" | head -n 100 >> $GITHUB_STEP_SUMMARY || tail -n 100 "$GITHUB_WORKSPACE/xcodebuild.log" >> $GITHUB_STEP_SUMMARY
          else
            echo "No xcode logs generated" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Publish Error Release If Failed
        if: failure()
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: build-error-log
          name: "Build Error Diagnostic Log"
          files: |
            ${{ github.workspace }}/xcode_errors.txt
            ${{ github.workspace }}/xcodebuild.log
          draft: false
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            xcode_errors.txt
          retention-days: 3
          if-no-files-found: ignore
