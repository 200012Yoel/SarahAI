name: Apply Composer Voice Recording Fix

on:
  push:
    branches:
      - feature/chatgpt-ui-media-shortcuts-20260922
    paths:
      - tools/apply_composer_voice_recording_fix.py
      - .github/workflows/apply-composer-voice-recording-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/chatgpt-ui-media-shortcuts-20260922
          fetch-depth: 0

      - name: Apply UI and recording patch
        run: |
          python3 tools/apply_composer_voice_recording_fix.py
          git diff --check
          git diff -- SarahIA/SarahIA/Views/ChatScreenView.swift .github/workflows/ios-build.yml

      - name: Commit integration
        run: |
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@github.com"
          git add SarahIA/SarahIA/Views/ChatScreenView.swift .github/workflows/ios-build.yml
          git diff --cached --quiet && exit 0
          git commit -m "Raise composer, restore voice, record simulator UI"
          git push origin HEAD:feature/chatgpt-ui-media-shortcuts-20260922
