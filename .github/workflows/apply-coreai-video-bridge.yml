name: Apply Core AI Adaptive Video Bridge

on:
  push:
    branches:
      - feature/chatgpt-ui-media-shortcuts-20260922
    paths:
      - tools/apply_coreai_video_bridge.py
      - .github/workflows/apply-coreai-video-bridge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/chatgpt-ui-media-shortcuts-20260922

      - name: Validate patch script
        run: python3 -m py_compile tools/apply_coreai_video_bridge.py

      - name: Apply Core AI video bridge
        run: python3 tools/apply_coreai_video_bridge.py

      - name: Validate diff
        run: git diff --check

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@github.com"
          git add \
            SarahIA/SarahIA/Services/HardwareDetector.swift \
            SarahIA/SarahIA/Services/SarahLocalImageGenEngine.swift \
            SarahIA/SarahIA/Services/BackgroundModelDownloader.swift
          git commit -m "Integrate adaptive Core AI video backend"
          git push origin HEAD:feature/chatgpt-ui-media-shortcuts-20260922
