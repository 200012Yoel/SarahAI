name: Real Website Generation And Voice Rework
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-tested-build.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply real site generation and voice rework
        run: python3 scripts/real_site_generation_voice_rework.py
      - name: Validate and commit rework
        run: |
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SarahIA/SarahIA/ViewModels/ChatViewModel.swift \
                  SarahIA/SarahIA/Views/ChatScreenView.swift \
                  SarahIA/SarahIA/Services/MultiAgentVoiceManager.swift \
                  SarahIA/SarahIA/Services/VAICodeEngine.swift
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Use real AI website generation and reliable voice sequencing"
            git push origin HEAD:main
          fi
      - name: Start SarahIA iOS device build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting real website generation build v23"
          gh workflow run ios-build.yml --repo "${{ github.repository }}" --ref main -f confirm_release=yes
