name: Apply Adaptive Site Styles and Voice Cards
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-tested-build.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply adaptive site styles and voice cards
        run: python3 scripts/adaptive_site_styles_voice_cards.py
      - name: Commit SarahIA changes
        run: |
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SarahIA/SarahIA/Views/ChatScreenView.swift SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add adaptive website styles and voice-guided cards"
            git push origin HEAD:main
          fi
