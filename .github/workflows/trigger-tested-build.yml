name: Rebuild Real Website Generation And Voice V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-tested-build.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply no-fallback site and voice overhaul
        run: python3 scripts/rebuild_real_website_generation_and_voice_v2.py
      - name: Validate and commit overhaul
        run: |
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SarahIA/SarahIA/ViewModels/ChatViewModel.swift \
                  SarahIA/SarahIA/Views/ChatScreenView.swift \
                  SarahIA/SarahIA/Views/VAICodingStudioView.swift \
                  SarahIA/SarahIA/Services/MultiAgentVoiceManager.swift \
                  SarahIA/SarahIA/Services/MultiAgentCoordinator.swift \
                  SarahIA/SarahIA/Services/VAICodeEngine.swift
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Remove fake dashboard fallback and rebuild site flow"
            git push origin HEAD:main
          fi
      - name: Start SarahIA iOS device build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting no-fallback site generator build v25"
          gh workflow run ios-build.yml --repo "${{ github.repository }}" --ref main -f confirm_release=yes
