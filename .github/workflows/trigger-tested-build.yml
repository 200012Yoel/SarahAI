name: Apply SarahIA Site Card Compile Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-tested-build.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Simplify voice-guided website cards
        run: python3 scripts/fix_site_card_compile.py
      - name: Commit compile fix
        run: |
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SarahIA/SarahIA/Views/ChatScreenView.swift
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix Swift compile for voice-guided website cards"
            git push origin HEAD:main
          fi
