name: SarahIA Cleanup And Rebuild
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-tested-build.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove every iOS Shortcuts feature
        run: python3 scripts/remove_ios_shortcuts_everywhere.py
      - name: Validate cleanup
        run: |
          set -e
          ! test -f SarahIA/SarahIA/Services/ShortcutGenerator.swift
          ! grep -q 'ShortcutGenerator.swift' SarahIA/SarahIA.xcodeproj/project.pbxproj
          ! grep -R -n -E 'generateAppleShortcut|generateShortcutJSON|ShortcutGenerator' SarahIA/SarahIA --include='*.swift'
          grep -q 'contextMenu' SarahIA/SarahIA/Views/ChatBubbleView.swift
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A SarahIA/SarahIA SarahIA/SarahIA.xcodeproj/project.pbxproj
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Cleanup already applied"
            gh workflow run ios-build.yml --repo "${{ github.repository }}" --ref main -f confirm_release=yes
          else
            git commit -m "Remove all iOS Shortcuts functionality"
            git push origin HEAD:main
          fi
        env:
          GH_TOKEN: ${{ github.token }}
