name: Trigger SarahIA IPA Build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-tested-build.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply SarahIA repair
        run: python3 scripts/restore_builder_bargein.py
      - name: Commit repair
        run: |
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SarahIA/SarahIA/Views/ChatScreenView.swift SarahIA/SarahIA/Services/MultiAgentCoordinator.swift SarahIA/SarahIA/Services/MultiAgentVoiceManager.swift SarahIA/SarahIA/ViewModels/ChatViewModel.swift SarahIA/SarahIA/Views/VoiceOrbModalView.swift
          git commit -m "Restore build 502 menus and voice barge-in"
          git push origin main
