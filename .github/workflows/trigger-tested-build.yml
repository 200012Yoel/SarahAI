name: Trigger SarahIA IPA Build
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-tested-build.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply voice echo guard
        run: python3 scripts/finalize_voice_bargein.py
      - name: Commit voice guard
        run: |
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SarahIA/SarahIA/ViewModels/ChatViewModel.swift
          git commit -m "Ignore speaker echo during voice barge-in"
          git push origin main
