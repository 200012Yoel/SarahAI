name: Strict Real Website Compile Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-tested-build.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix coordinator brace
        run: python3 scripts/fix_strict_web_brace.py
      - name: Validate and commit compile fix
        run: |
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SarahIA/SarahIA/Services/MultiAgentCoordinator.swift
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Brace fix already applied"
          else
            git commit -m "Fix strict web generation coordinator compilation"
            git push origin HEAD:main
          fi
      - name: Start SarahIA iOS device build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting strict real generation build after compile fix"
          gh workflow run ios-build.yml --repo "${{ github.repository }}" --ref main -f confirm_release=yes
