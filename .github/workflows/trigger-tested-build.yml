name: Minimal Studio Real Generator Voice Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-tested-build.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply real generator and voice interruption fix
        run: python3 scripts/final_site_voice_studio_fix.py
      - name: Validate and commit final changes
        run: |
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SarahIA/SarahIA/ViewModels/ChatViewModel.swift \
                  SarahIA/SarahIA/Services/MultiAgentVoiceManager.swift
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No additional patch changes needed"
          else
            git commit -m "Use real code generation and natural voice interruption"
            git push origin HEAD:main
          fi
      - name: Start SarahIA iOS device build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting minimal Studio and real generator build"
          gh workflow run ios-build.yml --repo "${{ github.repository }}" --ref main -f confirm_release=yes
