name: Message Long Press Actions
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-tested-build.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore Copy and Regenerate long-press actions
        run: python3 scripts/fix_message_long_press_actions.py
      - name: Validate and commit message interaction fix
        run: |
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SarahIA/SarahIA/Views/ChatBubbleView.swift \
                  SarahIA/SarahIA/Views/MessageList.swift \
                  SarahIA/SarahIA/Views/ChatScreenView.swift
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Long-press message actions already applied"
          else
            git commit -m "Restore Copy and Regenerate on user messages"
            git push origin HEAD:main
          fi
      - name: Start SarahIA iOS device build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting message long-press interaction build"
          gh workflow run ios-build.yml --repo "${{ github.repository }}" --ref main -f confirm_release=yes
