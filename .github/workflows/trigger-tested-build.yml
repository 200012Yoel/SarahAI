name: Apply Website Voice Step Sync Fix
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-tested-build.yml']
  workflow_dispatch:
permissions:
  actions: write
  contents: write
jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep automatic voice reads alive after step changes
        run: python3 scripts/fix_website_voice_step_change.py
      - name: Commit step sync fix
        run: |
          git config user.name "SarahIA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add SarahIA/SarahIA/Views/ChatScreenView.swift
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Keep website voice guide synced across steps"
            git push origin HEAD:main
          fi
      - name: Start SarahIA iOS device build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting website voice step-sync build v20"
          gh workflow run ios-build.yml --repo "${{ github.repository }}" --ref main -f confirm_release=yes
