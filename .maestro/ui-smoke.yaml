appId: com.sarahia.app
---
# 1. Menu latéral
- launchApp:
    clearState: true
- assertVisible: "Sarah"
- tapOn:
    id: "sarah.menu.button"
- assertVisible:
    id: "sarah.sidebar"
- assertVisible: "Aucune discussion pour le moment."

# 2. Recherche latérale : un seul tap doit suffire
- tapOn: "Rechercher"
- tapOn:
    id: "sarah.sidebar.search.field"
- inputText: "test recherche"
- assertVisible: "test recherche"

# 3. Menu des agents
- launchApp
- assertVisible: "Sarah"
- tapOn:
    id: "sarah.agent.menu"
- assertVisible: "Raphaël"
- assertVisible: "Yohan"
- assertVisible: "Tom"

# 4. Réglages
- launchApp
- tapOn:
    id: "sarah.settings.button"
- assertVisible: "Réglages"

# 5. Bouton + et menu de pièces jointes
- launchApp
- tapOn:
    id: "sarah.attachment.menu"
- assertVisible: "Photos"
- assertVisible: "Appareil photo"
- assertVisible: "Fichier"

# 6. Champ de saisie : un seul tap doit suffire
- launchApp
- tapOn:
    id: "sarah.composer.field"
- inputText: "test interaction SarahIA"
- assertVisible: "test interaction SarahIA"
- tapOn:
    id: "sarah.composer.action"
- assertVisible: "test interaction SarahIA"

# 7. Mode vocal Sarah : ouverture + écoute réelle
- launchApp
- assertVisible: "Sarah"
- tapOn:
    id: "sarah.composer.action"
- assertVisible: "Mode vocal"
- assertVisible: "Je t’écoute."
