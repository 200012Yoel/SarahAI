appId: com.sarahia.app
---
# Real production SwiftUI views. No replaced Whisper or prewritten translation.
- launchApp:
    clearState: true
- assertVisible: "Sarah"
- takeScreenshot: qa-artifacts/01-sarah-accueil
- tapOn:
    id: "sarah.translateLive.open"
- assertVisible:
    id: "translateLiveTranslatedTopHalf"
- assertVisible:
    id: "translateLiveOriginalBottomHalf"
- takeScreenshot: qa-artifacts/02-translate-live
# Translate Live starts listening automatically on presentation.
# The microphone status is observable even without a physical TV feed.
- assertVisible:
    id: "translateLive.pipelineStatus"
- assertVisible:
    id: "translateLive.micStatus"
- takeScreenshot: qa-artifacts/03-translate-live-ecoute
# This simulator check cannot verify physical iPhone microphone, TV, echo
# cancellation or Bluetooth audio; those require physical-device QA.
